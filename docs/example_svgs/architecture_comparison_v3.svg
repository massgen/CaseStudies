<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    CNN vs. Transformer Architecture Comparison
    ViewBox: 1200x800
    Palette: Academic (Muted Blues, Grays, Accent Orange)
  -->
  
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>

    <!-- CNN Convolutional Filter Pattern -->
    <pattern id="convPattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#e1eaf2" stroke="#4A90E2" stroke-width="0.5"/>
      <rect x="2" y="2" width="2" height="2" fill="#4A90E2" opacity="0.6"/>
      <rect x="5" y="5" width="2" height="2" fill="#4A90E2" opacity="0.6"/>
    </pattern>

    <!-- Positional Encoding Pattern (Sinusoidal) -->
    <pattern id="posEncPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f8f9fa"/>
      <path d="M 0 10 Q 5 0 10 10 T 20 10" stroke="#F5A623" stroke-width="1" fill="none" opacity="0.4"/>
      <path d="M 0 15 Q 5 5 10 15 T 20 15" stroke="#4A90E2" stroke-width="1" fill="none" opacity="0.2"/>
    </pattern>

    <!-- Arrow Markers -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F5A623" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Main Title -->
  <text x="600" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">Deep Learning Architectures for Computer Vision</text>
  
  <!-- Column Headers -->
  <g font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#4A90E2">
    <text x="300" y="60" text-anchor="middle">Convolutional Neural Network (CNN)</text>
    <text x="900" y="60" text-anchor="middle">Vision Transformer (ViT)</text>
  </g>

  <!-- LEFT PIPELINE: CNN -->
  <g transform="translate(100, 80)">
    <!-- Stage 1: Input Image -->
    <g transform="translate(150, 0)">
      <rect x="-30" y="0" width="60" height="60" fill="#fff" stroke="#333" stroke-width="1.5"/>
      <image href="https://via.placeholder.com/60?text=IMG" x="-30" y="0" width="60" height="60" opacity="0.1"/>
      <rect x="-26" y="4" width="52" height="52" fill="#A5C8E1" opacity="0.4"/>
      <circle cx="0" cy="30" r="18" fill="#4A90E2" opacity="0.6"/>
      <text x="0" y="73" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Input Image</text>
      <text x="0" y="87" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">224×224×3</text>
    </g>
    <line x1="150" y1="95" x2="150" y2="125" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Stage 2: Conv Layers -->
    <g transform="translate(60, 160)">
      <rect width="180" height="60" fill="#fdfdfd" stroke="#4A90E2" stroke-width="2" rx="4"/>
      <!-- Filter visual -->
      <rect x="15" y="10" width="30" height="30" fill="url(#convPattern)" stroke="#4A90E2" stroke-width="0.5"/>
      <rect x="75" y="10" width="30" height="30" fill="url(#convPattern)" stroke="#4A90E2" stroke-width="0.5"/>
      <rect x="135" y="10" width="30" height="30" fill="url(#convPattern)" stroke="#4A90E2" stroke-width="0.5"/>
      <text x="90" y="52" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Convolutional Layers</text>
      <text x="200" y="35" font-family="Arial" font-size="11" fill="#666" text-anchor="start">112×112×64</text>
    </g>
    <line x1="150" y1="220" x2="150" y2="250" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Stage 3: Pooling & Blocks -->
    <g transform="translate(60, 260)">
      <!-- Pooling -->
      <rect x="0" y="0" width="180" height="40" fill="#eee" stroke="#999" rx="4"/>
      <text x="90" y="25" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Pooling (Max/Avg)</text>
      <text x="200" y="25" font-family="Arial" font-size="11" fill="#666" text-anchor="start">56×56×64</text>
      
      <!-- Arrow down -->
      <line x1="90" y1="40" x2="90" y2="70" stroke="#999" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrow)"/>
      
      <!-- Deep Stack -->
      <rect x="0" y="70" width="180" height="240" fill="#f8f9fa" stroke="#4A90E2" stroke-dasharray="4,2" rx="4"/>
      <text x="90" y="180" font-family="Arial" font-size="13" fill="#888" font-style="italic" text-anchor="middle">Multiple Conv-Pool Blocks</text>
      <text x="90" y="295" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">7×7×512</text>
    </g>
    <line x1="150" y1="570" x2="150" y2="600" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Stage 4: FC Layers -->
    <g transform="translate(75, 610)">
      <rect width="150" height="50" fill="#fff" stroke="#333" stroke-width="1.5" rx="4"/>
      <circle cx="20" cy="15" r="3" fill="#4A90E2"/><circle cx="20" cy="25" r="3" fill="#4A90E2"/><circle cx="20" cy="35" r="3" fill="#4A90E2"/>
      <circle cx="130" cy="15" r="3" fill="#4A90E2"/><circle cx="130" cy="25" r="3" fill="#4A90E2"/><circle cx="130" cy="35" r="3" fill="#4A90E2"/>
      <line x1="25" y1="15" x2="125" y2="15" stroke="#ccc"/><line x1="25" y1="15" x2="125" y2="25" stroke="#ccc"/><line x1="25" y1="15" x2="125" y2="35" stroke="#ccc"/>
      <line x1="25" y1="35" x2="125" y2="15" stroke="#ccc"/><line x1="25" y1="35" x2="125" y2="25" stroke="#ccc"/><line x1="25" y1="35" x2="125" y2="35" stroke="#ccc"/>
      <text x="75" y="45" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Fully Connected</text>
    </g>
    <line x1="150" y1="660" x2="150" y2="690" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Stage 5: Output -->
    <g transform="translate(90, 700)">
      <rect width="120" height="35" fill="#F5A623" fill-opacity="0.1" stroke="#F5A623" stroke-width="2" rx="3"/>
      <text x="60" y="22" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Class Probabilities</text>
    </g>
  </g>

  <!-- RIGHT PIPELINE: TRANSFORMER -->
  <g transform="translate(700, 80)">
    <!-- Stage 1: Input + Patch Embedding -->
    <g transform="translate(200, 0)">
      <rect x="-30" y="0" width="60" height="60" fill="#fff" stroke="#333" stroke-width="1.5"/>
      <rect x="-26" y="4" width="52" height="52" fill="#A5C8E1" opacity="0.4"/>
      <!-- Patch Grid -->
      <g stroke="#fff" stroke-width="1">
        <line x1="-15" y1="0" x2="-15" y2="60"/><line x1="0" y1="0" x2="0" y2="60"/><line x1="15" y1="0" x2="15" y2="60"/>
        <line x1="-30" y1="15" x2="30" y2="15"/><line x1="-30" y1="30" x2="30" y2="30"/><line x1="-30" y1="45" x2="30" y2="45"/>
      </g>
      <text x="0" y="73" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Patch Embedding</text>
      <text x="0" y="87" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">14×14×768</text>
    </g>
    <line x1="200" y1="95" x2="200" y2="125" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Stage 2: Positional Encoding -->
    <g transform="translate(110, 160)">
      <rect width="180" height="40" fill="url(#posEncPattern)" stroke="#F5A623" stroke-width="1.5" rx="4"/>
      <text x="90" y="25" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Positional Encoding</text>
    </g>
    <line x1="200" y1="200" x2="200" y2="250" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Stage 3: Transformer Block -->
    <g transform="translate(20, 260)">
      <rect width="360" height="320" fill="#fcfcfc" stroke="#A5C8E1" stroke-width="2" rx="8"/>
      <text x="180" y="-10" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4× Transformer Encoder Block</text>
      
      <!-- Internal Block -->
      <g transform="translate(20, 20)">
        <rect width="320" height="280" fill="#fff" stroke="#eee" rx="4"/>
        
        <!-- LN 1 -->
        <rect x="80" y="10" width="160" height="25" fill="#f2f2f2" stroke="#bbb" rx="4"/>
        <text x="160" y="27" font-family="Arial" font-size="10" text-anchor="middle">Layer Norm</text>

        <!-- MHSA -->
        <g transform="translate(40, 50)">
          <rect width="240" height="85" fill="#eef3f7" stroke="#4A90E2" stroke-width="1.5" rx="4"/>
          <text x="120" y="20" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Multi-Head Self-Attention</text>
          <!-- Matrices -->
          <g transform="translate(30, 35)">
            <g transform="translate(0, 0)">
              <rect width="40" height="30" fill="#A5C8E1" stroke="#4A90E2"/><text x="20" y="20" font-family="Arial" font-size="11" text-anchor="middle">Q</text>
            </g>
            <g transform="translate(70, 0)">
              <rect width="40" height="30" fill="#A5C8E1" stroke="#4A90E2"/><text x="20" y="20" font-family="Arial" font-size="11" text-anchor="middle">K</text>
            </g>
            <g transform="translate(140, 0)">
              <rect width="40" height="30" fill="#A5C8E1" stroke="#4A90E2"/><text x="20" y="20" font-family="Arial" font-size="11" text-anchor="middle">V</text>
            </g>
          </g>
        </g>

        <!-- Residual 1 -->
        <path d="M 30 5 L 30 155 L 145 155" fill="none" stroke="#F5A623" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#orangeArrow)"/>
        <circle cx="160" cy="155" r="10" fill="#fff" stroke="#333"/>
        <text x="160" y="160" font-family="Arial" font-size="16" text-anchor="middle">+</text>

        <!-- LN 2 -->
        <rect x="80" y="180" width="160" height="25" fill="#f2f2f2" stroke="#bbb" rx="4"/>
        <text x="160" y="197" font-family="Arial" font-size="10" text-anchor="middle">Layer Norm</text>

        <!-- FFN -->
        <rect x="40" y="220" width="240" height="40" fill="#eef3f7" stroke="#4A90E2" stroke-width="1.5" rx="4"/>
        <text x="160" y="245" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Feed-Forward Network</text>

        <!-- Residual 2 -->
        <path d="M 290 170 L 290 275 L 175 275" fill="none" stroke="#F5A623" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#orangeArrow)"/>
        <circle cx="160" cy="275" r="10" fill="#fff" stroke="#333"/>
        <text x="160" y="280" font-family="Arial" font-size="16" text-anchor="middle">+</text>
      </g>
    </g>
    <line x1="200" y1="580" x2="200" y2="610" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Stage 4: MLP Head -->
    <g transform="translate(110, 610)">
      <rect width="180" height="50" fill="#eef3f7" stroke="#4A90E2" stroke-width="1.5" rx="4"/>
      <text x="90" y="30" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">MLP Classification Head</text>
    </g>
    <line x1="200" y1="660" x2="200" y2="700" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Stage 5: Output -->
    <g transform="translate(140, 700)">
      <rect width="120" height="35" fill="#F5A623" fill-opacity="0.1" stroke="#F5A623" stroke-width="2" rx="3"/>
      <text x="60" y="22" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Class Probabilities</text>
    </g>
  </g>

  <!-- Alignment Guides (Labels) -->
  <g font-family="Arial" font-size="11" fill="#bbb" text-anchor="middle">
    <text x="600" y="130">IMAGE INPUT</text>
    <text x="600" y="235">FEATURE EXTRACTION</text>
    <text x="600" y="420">DEEP PROCESSING</text>
    <text x="600" y="680">CLASSIFICATION</text>
    <text x="600" y="780">OUTPUT</text>
    <!-- Visual guide lines -->
    <line x1="250" y1="130" x2="550" y2="130" stroke="#eee" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="650" y1="130" x2="950" y2="130" stroke="#eee" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="250" y1="235" x2="550" y2="235" stroke="#eee" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="650" y1="235" x2="950" y2="235" stroke="#eee" stroke-width="1" stroke-dasharray="5,5"/>
  </g>

</svg>
