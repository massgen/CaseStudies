<svg width="1400" height="800" viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#grid)"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    </pattern>

    <!-- Clipping -->
    <clipPath id="clipSum">
      <rect x="0" y="-220" width="400" height="440" />
    </clipPath>
    <clipPath id="clipComp">
      <rect x="0" y="-50" width="300" height="100" />
    </clipPath>

    <!-- Gradients -->
    <linearGradient id="gradSum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6" />
      <stop offset="50%" style="stop-color:#2563eb" />
      <stop offset="100%" style="stop-color:#3b82f6" />
    </linearGradient>

    <!-- Harmonic Styles -->
    <style>
      .h1 { stroke: #ef4444; } .h1-f { fill: #ef4444; }
      .h2 { stroke: #f97316; } .h2-f { fill: #f97316; }
      .h3 { stroke: #eab308; } .h3-f { fill: #eab308; }
      .h4 { stroke: #22c55e; } .h4-f { fill: #22c55e; }
      .h5 { stroke: #06b6d4; } .h5-f { fill: #06b6d4; }
      .h6 { stroke: #6366f1; } .h6-f { fill: #6366f1; }
      .h7 { stroke: #d946ef; } .h7-f { fill: #d946ef; }
    </style>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700family=JetBrains+Monodisplay=swap');
    
    text { font-family: 'Inter', sans-serif; fill: #1e293b; }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    .title { font-size: 30px; font-weight: 700; fill: #0f172a; }
    .formula { font-family: "Times New Roman", serif; font-style: italic; font-size: 26px; fill: #475569; }
    .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; fill: #64748b; }
    .axis { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .label { font-size: 10px; fill: #94a3b8; font-weight: 600; }
    
    /* Animation: Continuous Flow */
    @keyframes flow {
      from { transform: translateX(0); }
      to { transform: translateX(-300px); }
    }
    .flow-wave { animation: flow 4s linear infinite; }
    
    /* Phase Indicators */
    @keyframes rot1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes rot2 { from { transform: rotate(0deg); } to { transform: rotate(720deg); } }
    @keyframes rot3 { from { transform: rotate(0deg); } to { transform: rotate(1080deg); } }
    @keyframes rot4 { from { transform: rotate(0deg); } to { transform: rotate(1440deg); } }
    @keyframes rot5 { from { transform: rotate(0deg); } to { transform: rotate(1800deg); } }
    @keyframes rot6 { from { transform: rotate(0deg); } to { transform: rotate(2160deg); } }
    @keyframes rot7 { from { transform: rotate(0deg); } to { transform: rotate(2520deg); } }
    
    .rot-h1 { animation: rot1 4s linear infinite; }
    .rot-h2 { animation: rot2 4s linear infinite; }
    .rot-h3 { animation: rot3 4s linear infinite; }
    .rot-h4 { animation: rot4 4s linear infinite; }
    .rot-h5 { animation: rot5 4s linear infinite; }
    .rot-h6 { animation: rot6 4s linear infinite; }
    .rot-h7 { animation: rot7 4s linear infinite; }

    @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.5; } }
    .conn { stroke: #cbd5e1; stroke-dasharray: 4,4; animation: pulse 2s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1400" height="800" fill="url(#gridMajor)" />

  <!-- Title & Formula -->
  <g transform="translate(700, 50)">
    <text text-anchor="middle" class="title">Fourier Decomposition Dashboard</text>
    <text y="40" text-anchor="middle" class="formula">f(t) = ∑ Aₙ sin(2πnft + φₙ)</text>
  </g>

  <!-- COLUMN 1: COMPLEX WAVEFORM -->
  <g transform="translate(70, 400)">
    <text x="200" y="-240" text-anchor="middle" class="section-title">Composite Signal (Sum of 7 Harmonics)</text>
    
    <!-- Coordinate System -->
    <path d="M 0,-210 V 210 M 0,0 H 410" class="axis" />
    <text x="150" y="20" class="label" text-anchor="middle">T</text>
    <text x="300" y="20" class="label" text-anchor="middle">2T</text>
    
    <g clip-path="url(#clipSum)">
      <g class="flow-wave">
        <!-- Mathematically calculated sum of 7 harmonics: A=[100, 50, 60, 30, 40, 20, 10], phi=[0, 45, 90, 180, 270, 0, 90] -->
        <!-- High-res path spans 3T (900px) -->
        <path d="M 0,-56.3 L 15,-18.2 L 30,34.1 L 45,85.6 L 60,113.4 L 75,107.2 L 90,75.1 L 105,37.2 L 120,6.5 L 135,-15.4 L 150,-35.1 L 165,-64.3 L 180,-108.2 L 195,-152.1 L 210,-173.4 L 225,-158.2 L 240,-115.4 L 255,-68.3 L 270,-42.1 L 285,-48.6 L 300,-56.3 L 315,-18.2 L 330,34.1 L 345,85.6 L 360,113.4 L 375,107.2 L 390,75.1 L 405,37.2 L 420,6.5 L 435,-15.4 L 450,-35.1 L 465,-64.3 L 480,-108.2 L 495,-152.1 L 510,-173.4 L 525,-158.2 L 540,-115.4 L 555,-68.3 L 570,-42.1 L 585,-48.6 L 600,-56.3 L 615,-18.2 L 630,34.1 L 645,85.6 L 660,113.4 L 675,107.2 L 690,75.1 L 705,37.2 L 720,6.5 L 735,-15.4 L 750,-35.1 L 765,-64.3 L 780,-108.2 L 795,-152.1 L 810,-173.4 L 825,-158.2 L 840,-115.4 L 855,-68.3 L 870,-42.1 L 885,-48.6 L 900,-56.3" 
              fill="none" stroke="url(#gradSum)" stroke-width="5" stroke-linejoin="round" />
      </g>
    </g>
    
    <!-- Annotations for interesting features -->
    <g font-size="10" font-weight="600" fill="#475569">
      <text x="220" y="-180">SHARP PEAK</text>
      <circle cx="210" cy="-173" r="6" fill="none" stroke="#ef4444" stroke-width="2" />
      <text x="60" y="130">FLAT REGION</text>
      <path d="M 50,113 L 90,113" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3,3" />
    </g>
  </g>

  <!-- COLUMN 2: DECOMPOSITION -->
  <g transform="translate(560, 110)">
    <text x="150" y="-20" text-anchor="middle" class="section-title">Harmonic Decomposition</text>
    
    <!-- Harmonic 1: f -->
    <g transform="translate(0, 40)">
      <line x2="300" class="axis" opacity="0.3" />
      <text x="-15" y="4" text-anchor="end" class="mono">f: A=1.00 φ=0°</text>
      <g clip-path="url(#clipComp)"><g class="flow-wave">
        <path d="M 0,0 L 15,31 L 30,59 L 45,81 L 60,95 L 75,100 L 90,95 L 105,81 L 120,59 L 135,31 L 150,0 L 165,-31 L 180,-59 L 195,-81 L 210,-95 L 225,-100 L 240,-95 L 255,-81 L 270,-59 L 285,-31 L 300,0 L 315,31 L 330,59 L 345,81 L 360,95 L 375,100 L 390,95 L 405,81 L 420,59 L 435,31 L 450,0 L 465,-31 L 480,-59 L 495,-81 L 510,-95 L 525,-100 L 540,-95 L 555,-81 L 570,-59 L 585,-31 L 600,0 L 615,31 L 630,59 L 645,81 L 660,95 L 675,100 L 690,95 L 705,81 L 720,59 L 735,31 L 750,0 L 765,-31 L 780,-59 L 795,-81 L 810,-95 L 825,-100 L 840,-95 L 855,-81 L 870,-59 L 885,-31 L 900,0" 
              fill="none" class="h1" stroke-width="2.5" transform="scale(1, 0.4)" />
      </g></g>
      <line x1="0" y1="0" x2="-90" y2="250" class="conn" />
    </g>

    <!-- Harmonic 2: 2f -->
    <g transform="translate(0, 130)">
      <line x2="300" class="axis" opacity="0.3" />
      <text x="-15" y="4" text-anchor="end" class="mono">2f: A=0.50 φ=45°</text>
      <g clip-path="url(#clipComp)"><g class="flow-wave">
        <path d="M 0,35.4 L 15,48.3 L 30,35.4 L 45,0 L 60,-35.4 L 75,-48.3 L 90,-35.4 L 105,0 L 120,35.4 L 135,48.3 L 150,35.4 L 165,0 L 180,-35.4 L 195,-48.3 L 210,-35.4 L 225,0 L 240,35.4 L 255,48.3 L 270,35.4 L 285,0 L 300,35.4 L 315,48.3 L 330,35.4 L 345,0 L 360,-35.4 L 375,-48.3 L 390,-35.4 L 405,0 L 420,35.4 L 435,48.3 L 450,35.4 L 465,0 L 480,-35.4 L 495,-48.3 L 510,-35.4 L 525,0 L 540,35.4 L 555,48.3 L 570,35.4 L 585,0 L 600,35.4 L 615,48.3 L 630,35.4 L 645,0 L 660,-35.4 L 675,-48.3 L 690,-35.4 L 705,0 L 720,35.4 L 735,48.3 L 750,35.4 L 765,0 L 780,-35.4 L 795,-48.3 L 810,-35.4 L 825,0 L 840,35.4 L 855,48.3 L 870,35.4 L 885,0 L 900,35.4" 
              fill="none" class="h2" stroke-width="2" transform="scale(1, 0.6)" />
      </g></g>
      <line x1="0" y1="0" x2="-90" y2="160" class="conn" />
    </g>

    <!-- Harmonic 3: 3f -->
    <g transform="translate(0, 220)">
      <line x2="300" class="axis" opacity="0.3" />
      <text x="-15" y="4" text-anchor="end" class="mono">3f: A=0.60 φ=90°</text>
      <g clip-path="url(#clipComp)"><g class="flow-wave">
        <path d="M 0,-50 L 15,-15.4 L 30,15.4 L 45,50 L 60,15.4 L 75,-15.4 L 90,-50 L 105,-15.4 L 120,15.4 L 135,50 L 150,15.4 L 165,-15.4 L 180,-50 L 195,-15.4 L 210,15.4 L 225,50 L 240,15.4 L 255,-15.4 L 270,-50 L 285,-15.4 L 300,-50 L 315,-15.4 L 330,15.4 L 345,50 L 360,15.4 L 375,-15.4 L 390,-50 L 405,-15.4 L 420,15.4 L 435,50 L 450,15.4 L 465,-15.4 L 480,-50 L 495,-15.4 L 510,15.4 L 525,50 L 540,15.4 L 555,-15.4 L 570,-50 L 585,-15.4 L 600,-50 L 615,-15.4 L 630,15.4 L 645,50 L 660,15.4 L 675,-15.4 L 690,-50 L 705,-15.4 L 720,15.4 L 735,50 L 750,15.4 L 765,-15.4 L 780,-50 L 795,-15.4 L 810,15.4 L 825,50 L 840,15.4 L 855,-15.4 L 870,-50 L 885,-15.4 L 900,-50" 
              fill="none" class="h3" stroke-width="2" transform="scale(1, 0.7)" />
      </g></g>
      <line x1="0" y1="0" x2="-90" y2="70" class="conn" />
    </g>

    <!-- Harmonic 4: 4f -->
    <g transform="translate(0, 310)">
      <line x2="300" class="axis" opacity="0.3" />
      <text x="-15" y="4" text-anchor="end" class="mono">4f: A=0.30 φ=180°</text>
      <g clip-path="url(#clipComp)"><g class="flow-wave">
        <path d="M 0,0 L 15,-21 L 30,0 L 45,21 L 60,0 L 75,-21 L 90,0 L 105,21 L 120,0 L 135,-21 L 150,0 L 165,21 L 180,0 L 195,-21 L 210,0 L 225,21 L 240,0 L 255,-21 L 270,0 L 285,21 L 300,0 L 315,-21 L 330,0 L 345,21 L 360,0 L 375,-21 L 390,0 L 405,21 L 420,0 L 435,-21 L 450,0 L 465,21 L 480,0 L 495,-21 L 510,0 L 525,21 L 540,0 L 555,-21 L 570,0 L 585,21 L 600,0 L 615,-21 L 630,0 L 645,21 L 660,0 L 675,-21 L 690,0 L 705,21 L 720,0 L 735,-21 L 750,0 L 765,21 L 780,0 L 795,-21 L 810,0 L 825,21 L 840,0 L 855,-21 L 870,0 L 885,21 L 900,0" 
              fill="none" class="h4" stroke-width="1.8" transform="scale(1, 0.8)" />
      </g></g>
      <line x1="0" y1="0" x2="-90" y2="-20" class="conn" />
    </g>

    <!-- Harmonic 5: 5f -->
    <g transform="translate(0, 400)">
      <line x2="300" class="axis" opacity="0.3" />
      <text x="-15" y="4" text-anchor="end" class="mono">5f: A=0.40 φ=270°</text>
      <g clip-path="url(#clipComp)"><g class="flow-wave">
        <path d="M 0,30 L 15,-30 L 30,30 L 45,-30 L 60,30 L 75,-30 L 90,30 L 105,-30 L 120,30 L 135,-30 L 150,30 L 165,-30 L 180,30 L 195,-30 L 210,30 L 225,-30 L 240,30 L 255,-30 L 270,30 L 285,-30 L 300,30 L 315,-30 L 330,30 L 345,-30 L 360,30 L 375,-30 L 390,30 L 405,-30 L 420,30 L 435,-30 L 450,30 L 465,-30 L 480,30 L 495,-30 L 510,30 L 525,-30 L 540,30 L 555,-30 L 570,30 L 585,-30 L 600,30 L 615,-30 L 630,30 L 645,-30 L 660,30 L 675,-30 L 690,30 L 705,-30 L 720,30 L 735,-30 L 750,30 L 765,-30 L 780,30 L 795,-30 L 810,30 L 825,-30 L 840,30 L 855,-30 L 870,30 L 885,-30 L 900,30" 
              fill="none" class="h5" stroke-width="1.5" transform="scale(1, 0.9)" />
      </g></g>
      <line x1="0" y1="0" x2="-90" y2="-110" class="conn" />
    </g>

    <!-- Harmonic 6: 6f -->
    <g transform="translate(0, 490)">
      <line x2="300" class="axis" opacity="0.3" />
      <text x="-15" y="4" text-anchor="end" class="mono">6f: A=0.20 φ=0°</text>
      <g clip-path="url(#clipComp)"><g class="flow-wave">
        <path d="M 0,0 L 15,0 L 30,0 L 45,0 L 60,0 L 75,0 L 90,0 L 105,0 L 120,0 L 135,0 L 150,0 L 165,0 L 180,0 L 195,0 L 210,0 L 225,0 L 240,0 L 255,0 L 270,0 L 285,0 L 300,0 L 315,0 L 330,0 L 345,0 L 360,0 L 375,0 L 390,0 L 405,0 L 420,0 L 435,0 L 450,0 L 465,0 L 480,0 L 495,0 L 510,0 L 525,0 L 540,0 L 555,0 L 570,0 L 585,0 L 600,0 L 615,0 L 630,0 L 645,0 L 660,0 L 675,0 L 690,0 L 705,0 L 720,0 L 735,0 L 750,0 L 765,0 L 780,0 L 795,0 L 810,0 L 825,0 L 840,0 L 855,0 L 870,0 L 885,0 L 900,0" 
              fill="none" class="h6" stroke-width="1.2" transform="scale(1, 0.8)" />
      </g></g>
      <line x1="0" y1="0" x2="-90" y2="-200" class="conn" />
    </g>

    <!-- Harmonic 7: 7f -->
    <g transform="translate(0, 580)">
      <line x2="300" class="axis" opacity="0.3" />
      <text x="-15" y="4" text-anchor="end" class="mono">7f: A=0.10 φ=90°</text>
      <g clip-path="url(#clipComp)"><g class="flow-wave">
        <path d="M 0,-10 L 15,10 L 30,-10 L 45,10 L 60,-10 L 75,10 L 90,-10 L 105,10 L 120,-10 L 135,10 L 150,-10 L 165,10 L 180,-10 L 195,10 L 210,-10 L 225,10 L 240,-10 L 255,10 L 270,-10 L 285,10 L 300,-10 L 315,10 L 330,-10 L 345,10 L 360,-10 L 375,10 L 390,-10 L 405,10 L 420,-10 L 435,10 L 450,-10 L 465,10 L 480,-10 L 495,10 L 510,-10 L 525,10 L 540,-10 L 555,10 L 570,-10 L 585,10 L 600,-10 L 615,10 L 630,-10 L 645,10 L 660,-10 L 675,10 L 690,-10 L 705,10 L 720,-10 L 735,10 L 750,-10 L 765,10 L 780,-10 L 795,10 L 810,-10 L 825,10 L 840,-10 L 855,10 L 870,-10 L 885,10 L 900,-10" 
              fill="none" class="h7" stroke-width="1" />
      </g></g>
      <line x1="0" y1="0" x2="-90" y2="-290" class="conn" />
    </g>
  </g>

  <!-- COLUMN 3: ANALYSIS -->
  <g transform="translate(1040, 110)">
    <!-- Phase Spectrum -->
    <text x="160" y="-20" text-anchor="middle" class="section-header">Phase Spectrum</text>
    <g transform="translate(0, 20)">
      <g transform="translate(50, 45)">
        <circle r="35" fill="white" stroke="#e2e8f0" stroke-width="2" />
        <g class="rot-h1"><line x1="0" y1="0" x2="35" y2="0" class="h1" stroke-width="4" stroke-linecap="round" /></g>
        <text y="55" text-anchor="middle" class="label">f</text>
      </g>
      <g transform="translate(160, 45)">
        <circle r="35" fill="white" stroke="#e2e8f0" stroke-width="2" />
        <g class="rot-h2" transform="rotate(45)"><line x1="0" y1="0" x2="35" y2="0" class="h2" stroke-width="4" stroke-linecap="round" /></g>
        <text y="55" text-anchor="middle" class="label">2f</text>
      </g>
      <g transform="translate(270, 45)">
        <circle r="35" fill="white" stroke="#e2e8f0" stroke-width="2" />
        <g class="rot-h3" transform="rotate(90)"><line x1="0" y1="0" x2="35" y2="0" class="h3" stroke-width="4" stroke-linecap="round" /></g>
        <text y="55" text-anchor="middle" class="label">3f</text>
      </g>
      <g transform="translate(50, 155)">
        <circle r="35" fill="white" stroke="#e2e8f0" stroke-width="2" />
        <g class="rot-h4" transform="rotate(180)"><line x1="0" y1="0" x2="35" y2="0" class="h4" stroke-width="4" stroke-linecap="round" /></g>
        <text y="55" text-anchor="middle" class="label">4f</text>
      </g>
      <g transform="translate(160, 155)">
        <circle r="35" fill="white" stroke="#e2e8f0" stroke-width="2" />
        <g class="rot-h5" transform="rotate(270)"><line x1="0" y1="0" x2="35" y2="0" class="h5" stroke-width="4" stroke-linecap="round" /></g>
        <text y="55" text-anchor="middle" class="label">5f</text>
      </g>
      <g transform="translate(270, 155)">
        <circle r="35" fill="white" stroke="#e2e8f0" stroke-width="2" />
        <g class="rot-h6"><line x1="0" y1="0" x2="35" y2="0" class="h6" stroke-width="4" stroke-linecap="round" /></g>
        <text y="55" text-anchor="middle" class="label">6f</text>
      </g>
      <g transform="translate(160, 260)">
        <circle r="35" fill="white" stroke="#e2e8f0" stroke-width="2" />
        <g class="rot-h7" transform="rotate(90)"><line x1="0" y1="0" x2="35" y2="0" class="h7" stroke-width="4" stroke-linecap="round" /></g>
        <text y="55" text-anchor="middle" class="label">7f</text>
      </g>
    </g>

    <!-- Magnitude Spectrum -->
    <g transform="translate(0, 380)">
      <text x="160" y="-10" text-anchor="middle" class="section-header">Magnitude Spectrum</text>
      <path d="M 30,30 V 230 H 310" class="axis" />
      <rect x="50" y="30" width="25" height="200" class="h1-f" rx="2" />
      <rect x="85" y="130" width="25" height="100" class="h2-f" rx="2" />
      <rect x="120" y="110" width="25" height="120" class="h3-f" rx="2" />
      <rect x="155" y="170" width="25" height="60" class="h4-f" rx="2" />
      <rect x="190" y="150" width="25" height="80" class="h5-f" rx="2" />
      <rect x="225" y="190" width="25" height="40" class="h6-f" rx="2" />
      <rect x="260" y="210" width="25" height="20" class="h7-f" rx="2" />
      
      <g class="label" transform="translate(30, 250)">
        <text x="32" y="0" text-anchor="middle">f</text>
        <text x="67" y="0" text-anchor="middle">2f</text>
        <text x="102" y="0" text-anchor="middle">3f</text>
        <text x="137" y="0" text-anchor="middle">4f</text>
        <text x="172" y="0" text-anchor="middle">5f</text>
        <text x="207" y="0" text-anchor="middle">6f</text>
        <text x="242" y="0" text-anchor="middle">7f</text>
      </g>
    </g>
  </g>
  
  <!-- Info Box -->
  <g transform="translate(70, 650)">
    <rect width="400" height="80" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="20" y="30" font-size="12" font-weight="700" fill="#64748b">RECOGNIZED FEATURES:</text>
    <text x="20" y="55" font-size="11" fill="#94a3b8">• Sharp peaks due to higher harmonic phase alignment</text>
    <text x="20" y="70" font-size="11" fill="#94a3b8">• Pseudo-flat regions from destructive interference</text>
  </g>
</svg>
