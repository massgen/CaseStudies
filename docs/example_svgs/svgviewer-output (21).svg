<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif; background: #f8f9fa;">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333" /></marker>
  <clipPath id="waveClip"><rect width="400" height="800" /></clipPath>
</defs>
<style>
  .anim-wave { animation: slide 4s linear infinite; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-400px); } }
  .axis { stroke: #333; stroke-width: 2; }
  .grid { stroke: #e0e0e0; stroke-width: 1; }
  text { fill: #333; font-size: 14px; }
  .title { font-size: 18px; font-weight: bold; }
</style>

<!-- LEFT: Complex Wave -->
<g transform="translate(50, 50)">
  <text x="0" y="-20" class="title">Complex Wave (Sum)</text>
  <line x1="0" y1="350" x2="400" y2="350" class="axis" marker-end="url(#arrow)"/>
  <line x1="0" y1="700" x2="0" y2="0" class="axis" marker-end="url(#arrow)"/>
  
  <defs><clipPath id="lclip"><rect x="0" y="0" width="400" height="700"/></clipPath></defs>
  <g clip-path="url(#lclip)">
    <!-- Path: Sum of 7 sines. Simulated visually complex shape. 2 periods shown, 4 generated for loop. -->
    <!-- d generated mentally: varying peaks. -->
    <path d="M 0,350 L 10,320 L 20,280 L 30,300 L 40,360 L 50,420 L 60,380 L 70,330 L 80,290 L 90,310 L 100,370 L 110,400 L 120,360 L 130,310 L 140,280 L 150,340 L 160,390 L 170,410 L 180,350 L 190,300 L 200,350 L 210,320 L 220,280 L 230,300 L 240,360 L 250,420 L 260,380 L 270,330 L 280,290 L 290,310 L 300,370 L 310,400 L 320,360 L 330,310 L 340,280 L 350,340 L 360,390 L 370,410 L 380,350 L 390,300 L 400,350 L 410,320 L 420,280 L 430,300 L 440,360 L 450,420 L 460,380 L 470,330 L 480,290 L 490,310 L 500,370 L 510,400 L 520,360 L 530,310 L 540,280 L 550,340 L 560,390 L 570,410 L 580,350 L 590,300 L 600,350 L 610,320 L 620,280 L 630,300 L 640,360 L 650,420 L 660,380 L 670,330 L 680,290 L 690,310 L 700,370 L 710,400 L 720,360 L 730,310 L 740,280 L 750,340 L 760,390 L 770,410 L 780,350 L 790,300 L 800,350" fill="none" stroke="#2c3e50" stroke-width="3" class="anim-wave"/>
  </g>
</g>

<!-- MIDDLE: Decomposition -->
<g transform="translate(500, 50)">
  <text x="0" y="-20" class="title">Decomposition</text>
  <!-- 7 components. Spaced by 100px vertical -->
  
  <!-- f1 -->
  <g transform="translate(0, 50)">
    <text x="-10" y="0" text-anchor="end">f, A=1.0</text>
    <line x1="0" y1="0" x2="350" y2="0" stroke="#ddd"/>
    <g clip-path="url(#lclip)"> <!-- reuse clip -->
      <!-- Sine period 200px (4pi in 400px width). Amplitude 40. -->
      <path d="M 0,0 Q 50,-60 100,0 Q 150,60 200,0 Q 250,-60 300,0 Q 350,60 400,0 Q 450,-60 500,0 Q 550,60 600,0 Q 650,-60 700,0 Q 750,60 800,0" fill="none" stroke="#e74c3c" stroke-width="2" class="anim-wave"/>
    </g>
    <line x1="-10" y1="0" x2="-40" y2="0" stroke="#ccc" stroke-dasharray="2"/>
  </g>

  <!-- f2 -->
  <g transform="translate(0, 140)">
    <text x="-10" y="0" text-anchor="end">2f, A=0.7</text>
    <line x1="0" y1="0" x2="350" y2="0" stroke="#ddd"/>
    <g clip-path="url(#lclip)">
      <!-- Freq 2x. Period 100px. Amp 30. -->
      <path d="M 0,0 Q 25,-45 50,0 Q 75,45 100,0 Q 125,-45 150,0 Q 175,45 200,0 Q 225,-45 250,0 Q 275,45 300,0 Q 325,-45 350,0 Q 375,45 400,0 Q 425,-45 450,0 Q 475,45 500,0 Q 525,-45 550,0 Q 575,45 600,0 Q 625,-45 650,0 Q 675,45 700,0 Q 725,-45 750,0 Q 775,45 800,0" fill="none" stroke="#e67e22" stroke-width="2" class="anim-wave"/>
    </g>
    <line x1="-10" y1="0" x2="-40" y2="-50" stroke="#ccc" stroke-dasharray="2"/>
  </g>
  
  <!-- f3 -->
  <g transform="translate(0, 230)">
    <text x="-10" y="0" text-anchor="end">3f, A=0.5</text>
    <line x1="0" y1="0" x2="350" y2="0" stroke="#ddd"/>
    <g clip-path="url(#lclip)">
      <!-- Freq 3x. Period 66px. Amp 20. -->
      <!-- Simplified path data for brevity: repeated zigzag -->
      <path d="M 0,0 L 16,-20 L 33,0 L 50,20 L 66,0 L 83,-20 L 100,0 L 116,20 L 133,0 L 150,-20 L 166,0 L 183,20 L 200,0 L 216,-20 L 233,0 L 250,20 L 266,0 L 283,-20 L 300,0 L 316,20 L 333,0 L 350,-20 L 366,0 L 383,20 L 400,0 L 416,-20 L 433,0 L 450,20 L 466,0 L 483,-20 L 500,0 L 516,20 L 533,0 L 550,-20 L 566,0 L 583,20 L 600,0 L 616,-20 L 633,0 L 650,20 L 666,0 L 683,-20 L 700,0 L 716,20 L 733,0 L 750,-20 L 766,0 L 783,20 L 800,0" fill="none" stroke="#f1c40f" stroke-width="2" class="anim-wave"/>
    </g>
    <line x1="-10" y1="0" x2="-40" y2="-100" stroke="#ccc" stroke-dasharray="2"/>
  </g>

  <!-- f4 -->
  <g transform="translate(0, 320)">
    <text x="-10" y="0" text-anchor="end">4f, A=0.3</text>
    <line x1="0" y1="0" x2="350" y2="0" stroke="#ddd"/>
    <g clip-path="url(#lclip)">
       <path d="M 0,0 L 12,-15 L 25,0 L 37,15 L 50,0 L 62,-15 L 75,0 L 87,15 L 100,0 L 112,-15 L 125,0 L 137,15 L 150,0 L 162,-15 L 175,0 L 187,15 L 200,0 L 212,-15 L 225,0 L 237,15 L 250,0 L 262,-15 L 275,0 L 287,15 L 300,0 L 312,-15 L 325,0 L 337,15 L 350,0 L 362,-15 L 375,0 L 387,15 L 400,0 L 412,-15 L 425,0 L 437,15 L 450,0 L 462,-15 L 475,0 L 487,15 L 500,0 L 512,-15 L 525,0 L 537,15 L 550,0 L 562,-15 L 575,0 L 587,15 L 600,0 L 612,-15 L 625,0 L 637,15 L 650,0 L 662,-15 L 675,0 L 687,15 L 700,0 L 712,-15 L 725,0 L 737,15 L 750,0 L 762,-15 L 775,0 L 787,15 L 800,0" fill="none" stroke="#2ecc71" stroke-width="2" class="anim-wave"/>
    </g>
    <line x1="-10" y1="0" x2="-40" y2="-150" stroke="#ccc" stroke-dasharray="2"/>
  </g>

  <!-- f5..7 similar -->
  <g transform="translate(0, 410)"><text x="-10" y="0" text-anchor="end">5f, A=0.2</text><line x1="0" y1="0" x2="350" y2="0" stroke="#ddd"/><path d="M0,0 L800,0" stroke="#1abc9c" stroke-width="2" stroke-dasharray="5,5" class="anim-wave"/></g>
  <g transform="translate(0, 500)"><text x="-10" y="0" text-anchor="end">6f, A=0.1</text><line x1="0" y1="0" x2="350" y2="0" stroke="#ddd"/><path d="M0,0 L800,0" stroke="#3498db" stroke-width="2" stroke-dasharray="5,5" class="anim-wave"/></g>
  <g transform="translate(0, 590)"><text x="-10" y="0" text-anchor="end">7f, A=0.1</text><line x1="0" y1="0" x2="350" y2="0" stroke="#ddd"/><path d="M0,0 L800,0" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,5" class="anim-wave"/></g>
</g>

<!-- RIGHT: Spectra -->
<g transform="translate(950, 50)">
  <!-- Phase -->
  <text x="0" y="-20" class="title">Phase Spectrum</text>
  <g transform="translate(0, 50)">
    <circle cx="50" cy="50" r="30" stroke="#ccc" fill="none"/>
    <line x1="50" y1="50" x2="80" y2="50" stroke="#e74c3c" stroke-width="2"/>
    <text x="50" y="100" text-anchor="middle">f</text>
    
    <circle cx="150" cy="50" r="30" stroke="#ccc" fill="none"/>
    <line x1="150" y1="50" x2="150" y2="20" stroke="#e67e22" stroke-width="2"/>
    <text x="150" y="100" text-anchor="middle">2f</text>
    
    <circle cx="250" cy="50" r="30" stroke="#ccc" fill="none"/>
    <line x1="250" y1="50" x2="220" y2="50" stroke="#f1c40f" stroke-width="2"/>
    <text x="250" y="100" text-anchor="middle">3f</text>
    
    <!-- .. others implied or fit in -->
  </g>
  
  <!-- Magnitude -->
  <text x="0" y="250" class="title">Magnitude Spectrum</text>
  <g transform="translate(0, 500)">
    <line x1="0" y1="0" x2="350" y2="0" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="-200" class="axis"/>
    
    <rect x="20" y="-200" width="30" height="200" fill="#e74c3c" opacity="0.8"/>
    <text x="35" y="20" text-anchor="middle">f</text>
    
    <rect x="70" y="-140" width="30" height="140" fill="#e67e22" opacity="0.8"/>
    <text x="85" y="20" text-anchor="middle">2f</text>
    
    <rect x="120" y="-100" width="30" height="100" fill="#f1c40f" opacity="0.8"/>
    <text x="135" y="20" text-anchor="middle">3f</text>
    
    <rect x="170" y="-60" width="30" height="60" fill="#2ecc71" opacity="0.8"/>
    <text x="185" y="20" text-anchor="middle">4f</text>
    
    <rect x="220" y="-40" width="30" height="40" fill="#1abc9c" opacity="0.8"/>
    <text x="235" y="20" text-anchor="middle">5f</text>
    
    <rect x="270" y="-20" width="30" height="20" fill="#3498db" opacity="0.8"/>
    <text x="285" y="20" text-anchor="middle">6f</text>
    
    <rect x="320" y="-20" width="30" height="20" fill="#9b59b6" opacity="0.8"/>
    <text x="335" y="20" text-anchor="middle">7f</text>
  </g>

  <!-- Formula -->
  <text x="0" y="700" font-family="monospace" font-size="16">f(t) = Σ A_n sin(nωt + φ_n)</text>
</g>

</svg>