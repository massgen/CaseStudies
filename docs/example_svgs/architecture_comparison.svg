<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
    
    <!-- Filter Pattern Marker -->
    <pattern id="filterPattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#4A90E2" fill-opacity="0.1"/>
      <path d="M 0 5 L 10 5 M 5 0 L 5 10" stroke="#4A90E2" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
    
    <!-- Positional Encoding Pattern -->
    <linearGradient id="posEnc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:0.2" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Titles -->
  <text x="300" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">CNN Architecture</text>
  <text x="900" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">Transformer (ViT) Architecture</text>

  <!-- Input Images (Aligned) -->
  <g transform="translate(240, 80)">
    <rect width="120" height="120" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
    <text x="60" y="140" font-family="Arial" font-size="12" text-anchor="middle">Input Image (224×224×3)</text>
    <!-- Placeholder image content -->
    <circle cx="60" cy="60" r="30" fill="#4A90E2" fill-opacity="0.5"/>
  </g>
  
  <g transform="translate(840, 80)">
    <rect width="120" height="120" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
    <text x="60" y="140" font-family="Arial" font-size="12" text-anchor="middle">Input Image (224×224×3)</text>
    <circle cx="60" cy="60" r="30" fill="#4A90E2" fill-opacity="0.5"/>
  </g>

  <!-- CNN PIPELINE -->
  <g id="cnn">
    <!-- Convolutional Layers -->
    <g transform="translate(220, 240)">
      <rect x="0" y="0" width="160" height="80" fill="#A5C8E1" stroke="#4A90E2" stroke-width="1" rx="5"/>
      <rect x="10" y="10" width="30" height="30" fill="url(#filterPattern)" stroke="#4A90E2"/>
      <rect x="50" y="10" width="30" height="30" fill="url(#filterPattern)" stroke="#4A90E2"/>
      <rect x="90" y="10" width="30" height="30" fill="url(#filterPattern)" stroke="#4A90E2"/>
      <text x="80" y="60" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Conv Layers</text>
      <text x="80" y="75" font-family="Arial" font-size="10" text-anchor="middle">112×112×64</text>
    </g>
    
    <!-- Pooling Layers -->
    <g transform="translate(240, 360)">
      <rect x="0" y="0" width="120" height="60" fill="#D1D1D1" stroke="#999" stroke-width="1" rx="5"/>
      <text x="60" y="30" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Pooling</text>
      <text x="60" y="50" font-family="Arial" font-size="10" text-anchor="middle">56×56×64 (Downsampling)</text>
    </g>

    <!-- More Conv/Pool Blocks -->
    <path d="M 300 420 L 300 450" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="310" y="440" font-family="Arial" font-size="10">...</text>

    <!-- Fully Connected Layers -->
    <g transform="translate(230, 480)">
      <rect x="0" y="0" width="140" height="120" fill="#f9f9f9" stroke="#333" stroke-width="1" rx="5"/>
      <!-- Lines to represent connections -->
      <line x1="20" y1="20" x2="120" y2="100" stroke="#ccc" stroke-width="0.5"/>
      <line x1="20" y1="40" x2="120" y2="80" stroke="#ccc" stroke-width="0.5"/>
      <line x1="20" y1="60" x2="120" y2="60" stroke="#ccc" stroke-width="0.5"/>
      <line x1="20" y1="80" x2="120" y2="40" stroke="#ccc" stroke-width="0.5"/>
      <line x1="20" y1="100" x2="120" y2="20" stroke="#ccc" stroke-width="0.5"/>
      <text x="70" y="110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Fully Connected</text>
    </g>

    <!-- Output Probabilities -->
    <g transform="translate(250, 650)">
      <rect x="0" y="0" width="100" height="50" fill="#FF8C00" fill-opacity="0.1" stroke="#FF8C00" stroke-width="1"/>
      <text x="50" y="25" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Softmax</text>
      <text x="50" y="45" font-family="Arial" font-size="10" text-anchor="middle">Probabilities</text>
    </g>
  </g>

  <!-- TRANSFORMER PIPELINE -->
  <g id="transformer">
    <!-- Patch Embedding -->
    <g transform="translate(840, 80)">
       <!-- Overlay Grid -->
       <line x1="30" y1="0" x2="30" y2="120" stroke="#fff" stroke-width="1" stroke-dasharray="2,2"/>
       <line x1="60" y1="0" x2="60" y2="120" stroke="#fff" stroke-width="1" stroke-dasharray="2,2"/>
       <line x1="90" y1="0" x2="90" y2="120" stroke="#fff" stroke-width="1" stroke-dasharray="2,2"/>
       <line x1="0" y1="30" x2="120" y2="30" stroke="#fff" stroke-width="1" stroke-dasharray="2,2"/>
       <line x1="0" y1="60" x2="120" y2="60" stroke="#fff" stroke-width="1" stroke-dasharray="2,2"/>
       <line x1="0" y1="90" x2="120" y2="90" stroke="#fff" stroke-width="1" stroke-dasharray="2,2"/>
    </g>
    <text x="900" y="225" font-family="Arial" font-size="12" text-anchor="middle">Patch Embedding (16×16 patches)</text>
    
    <!-- Positional Encoding -->
    <g transform="translate(850, 240)">
      <rect x="0" y="0" width="100" height="40" fill="url(#posEnc)" stroke="#4A90E2" rx="5"/>
      <text x="50" y="25" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Positional Encoding</text>
    </g>

    <!-- Transformer Encoder Blocks -->
    <g transform="translate(750, 310)">
      <!-- 4 Blocks -->
      <rect x="0" y="0" width="300" height="300" fill="#f0f4f8" stroke="#A5C8E1" stroke-width="2" rx="10"/>
      <text x="150" y="-10" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">4 × Transformer Encoder Blocks</text>
      
      <!-- Expanded Block Detail -->
      <g transform="translate(10, 10)">
        <rect width="280" height="280" fill="#fff" stroke="#A5C8E1" stroke-dasharray="5,5"/>
        
        <!-- Layer Norm 1 -->
        <rect x="40" y="20" width="200" height="20" fill="#e8eef3" stroke="#ccc" rx="3"/>
        <text x="140" y="35" font-family="Arial" font-size="10" text-anchor="middle">Layer Norm</text>
        
        <!-- Multi-Head Self-Attention -->
        <g transform="translate(40, 50)">
          <rect width="200" height="80" fill="#A5C8E1" fill-opacity="0.3" stroke="#4A90E2"/>
          <text x="100" y="20" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Multi-Head Self-Attention</text>
          
          <!-- QKV Visualization -->
          <rect x="10" y="30" width="40" height="40" fill="#4A90E2" fill-opacity="0.2" stroke="#4A90E2"/>
          <text x="30" y="55" font-family="Arial" font-size="10" text-anchor="middle">Q</text>
          <rect x="80" y="30" width="40" height="40" fill="#4A90E2" fill-opacity="0.2" stroke="#4A90E2"/>
          <text x="100" y="55" font-family="Arial" font-size="10" text-anchor="middle">K</text>
          <rect x="150" y="30" width="40" height="40" fill="#4A90E2" fill-opacity="0.2" stroke="#4A90E2"/>
          <text x="170" y="55" font-family="Arial" font-size="10" text-anchor="middle">V</text>
        </g>
        
        <!-- Residual 1 -->
        <path d="M 20 10 L 20 140 L 40 140" fill="none" stroke="#FF8C00" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>
        <circle cx="140" cy="140" r="8" fill="#fff" stroke="#333"/>
        <text x="140" y="144" font-family="Arial" font-size="12" text-anchor="middle">+</text>

        <!-- Layer Norm 2 -->
        <rect x="40" y="160" width="200" height="20" fill="#e8eef3" stroke="#ccc" rx="3"/>
        <text x="140" y="175" font-family="Arial" font-size="10" text-anchor="middle">Layer Norm</text>

        <!-- MLP / FFN -->
        <rect x="40" y="190" width="200" height="40" fill="#D1D1D1" fill-opacity="0.5" stroke="#999" rx="5"/>
        <text x="140" y="215" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">MLP (Feed Forward)</text>

        <!-- Residual 2 -->
        <path d="M 260 150 L 260 250 L 240 250" fill="none" stroke="#FF8C00" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>
        <circle cx="140" cy="250" r="8" fill="#fff" stroke="#333"/>
        <text x="140" y="254" font-family="Arial" font-size="12" text-anchor="middle">+</text>
      </g>
    </g>

    <!-- MLP Head -->
    <g transform="translate(820, 630)">
      <rect x="0" y="0" width="160" height="40" fill="#A5C8E1" stroke="#4A90E2" stroke-width="1" rx="5"/>
      <text x="80" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">MLP Head</text>
    </g>

    <!-- Output Probabilities -->
    <g transform="translate(850, 690)">
      <rect x="0" y="0" width="100" height="50" fill="#FF8C00" fill-opacity="0.1" stroke="#FF8C00" stroke-width="1"/>
      <text x="50" y="25" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Softmax</text>
      <text x="50" y="45" font-family="Arial" font-size="10" text-anchor="middle">Probabilities</text>
    </g>
  </g>

  <!-- Connectors -->
  <!-- CNN Arrows -->
  <line x1="300" y1="200" x2="300" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="320" x2="300" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="600" x2="300" y2="640" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Transformer Arrows -->
  <line x1="900" y1="200" x2="900" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="900" y1="280" x2="900" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="900" y1="610" x2="900" y2="620" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="900" y1="670" x2="900" y2="680" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Dimension Annotations -->
  <text x="385" y="270" font-family="Arial" font-size="11" fill="#666">112×112×64</text>
  <text x="365" y="390" font-family="Arial" font-size="11" fill="#666">56×56×64</text>
  <text x="375" y="540" font-family="Arial" font-size="11" fill="#666">1×1×1024</text>

  <text x="960" y="260" font-family="Arial" font-size="11" fill="#666">196×768</text>
  <text x="1060" y="460" font-family="Arial" font-size="11" fill="#666">196×768</text>
  <text x="985" y="650" font-family="Arial" font-size="11" fill="#666">1×1000</text>

</svg>
