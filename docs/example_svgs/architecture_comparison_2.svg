<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional Academic Color Palette -->
  <!-- Muted Blues: #4A90E2, #A5C8E1, #E8EEF3 -->
  <!-- Grays: #333333, #666666, #999999, #D1D1D1, #F0F0F0 -->
  <!-- Highlight: #FF8C00 (Residuals/Accents) -->

  <defs>
    <!-- Background Grid -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f2f2f2" stroke-width="1"/>
    </pattern>
    
    <!-- CNN Filter Pattern -->
    <pattern id="cnnFilter" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#A5C8E1" fill-opacity="0.2"/>
      <path d="M 0 4 L 8 4 M 4 0 L 4 8" stroke="#4A90E2" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
    
    <!-- Positional Encoding Visualization -->
    <linearGradient id="posEncodingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:0.25" />
      <stop offset="50%" style="stop-color:#4A90E2;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0.25" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="residualArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF8C00" />
    </marker>
  </defs>
  
  <!-- Subtle Grid Background -->
  <rect width="100%" height="100%" fill="url(#gridPattern)" />

  <!-- Main Headers -->
  <text x="300" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#333" text-anchor="middle">CNN Architecture</text>
  <text x="900" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#333" text-anchor="middle">Transformer (ViT) Architecture</text>

  <!-- CNN PIPELINE (Left) -->
  <g transform="translate(100, 100)">
    <!-- Input Image -->
    <g transform="translate(140, 0)">
      <rect width="120" height="120" fill="#E8EEF3" stroke="#333" stroke-width="2"/>
      <circle cx="60" cy="60" r="35" fill="#4A90E2" fill-opacity="0.4"/>
      <rect x="20" y="20" width="80" height="80" fill="none" stroke="#4A90E2" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="60" y="140" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Input Image</text>
      <text x="60" y="155" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">224×224×3</text>
    </g>

    <path d="M 200 165 L 200 210" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Conv Layers -->
    <g transform="translate(110, 220)">
      <rect width="180" height="100" fill="#E8EEF3" stroke="#4A90E2" stroke-width="1.5" rx="4"/>
      <rect x="15" y="15" width="40" height="40" fill="url(#cnnFilter)" stroke="#4A90E2" stroke-width="1"/>
      <rect x="70" y="15" width="40" height="40" fill="url(#cnnFilter)" stroke="#4A90E2" stroke-width="1"/>
      <rect x="125" y="15" width="40" height="40" fill="url(#cnnFilter)" stroke="#4A90E2" stroke-width="1"/>
      <text x="90" y="75" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Convolutional Layers</text>
      <text x="90" y="90" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">112×112×64</text>
    </g>

    <path d="M 200 325 L 200 360" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Pooling Layers -->
    <g transform="translate(130, 370)">
      <rect width="140" height="70" fill="#D1D1D1" stroke="#999" stroke-width="1.5" rx="4"/>
      <text x="70" y="35" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Pooling Layers</text>
      <text x="70" y="55" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">56×56×64 (Downsampling)</text>
    </g>

    <path d="M 200 445 L 200 480" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="210" y="470" font-family="Arial" font-size="14" fill="#666">...</text>

    <!-- Fully Connected Layers -->
    <g transform="translate(120, 500)">
      <rect width="160" height="120" fill="#F9F9F9" stroke="#333" stroke-width="1.5" rx="4"/>
      <g stroke="#CCCCCC" stroke-width="0.5">
        <line x1="20" y1="20" x2="140" y2="20"/><line x1="20" y1="20" x2="140" y2="40"/><line x1="20" y1="20" x2="140" y2="60"/>
        <line x1="20" y1="40" x2="140" y2="20"/><line x1="20" y1="40" x2="140" y2="40"/><line x1="20" y1="40" x2="140" y2="60"/>
        <line x1="20" y1="60" x2="140" y2="20"/><line x1="20" y1="60" x2="140" y2="40"/><line x1="20" y1="60" x2="140" y2="60"/>
        <line x1="20" y1="80" x2="140" y2="80"/><line x1="20" y1="80" x2="140" y2="100"/>
        <line x1="20" y1="100" x2="140" y2="80"/><line x1="20" y1="100" x2="140" y2="100"/>
      </g>
      <text x="80" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Fully Connected</text>
      <text x="80" y="115" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">1×1×1024</text>
    </g>

    <path d="M 200 625 L 200 660" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Output Probabilities -->
    <g transform="translate(150, 670)">
      <rect width="100" height="60" fill="#FF8C00" fill-opacity="0.1" stroke="#FF8C00" stroke-width="2"/>
      <text x="50" y="30" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Softmax</text>
      <text x="50" y="50" font-family="Arial" font-size="11" text-anchor="middle">Probabilities</text>
    </g>
  </g>

  <!-- TRANSFORMER PIPELINE (Right) -->
  <g transform="translate(700, 100)">
    <!-- Input Image with Grid -->
    <g transform="translate(140, 0)">
      <rect width="120" height="120" fill="#E8EEF3" stroke="#333" stroke-width="2"/>
      <circle cx="60" cy="60" r="35" fill="#4A90E2" fill-opacity="0.4"/>
      <!-- Patch Grid Overlay -->
      <g stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.8">
        <line x1="30" y1="0" x2="30" y2="120"/><line x1="60" y1="0" x2="60" y2="120"/><line x1="90" y1="0" x2="90" y2="120"/>
        <line x1="0" y1="30" x2="120" y2="30"/><line x1="0" y1="60" x2="120" y2="60"/><line x1="0" y1="90" x2="120" y2="90"/>
      </g>
      <text x="60" y="140" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Patch Embedding</text>
      <text x="60" y="155" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">14×14×768</text>
    </g>

    <path d="M 200 165 L 200 200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Positional Encoding -->
    <g transform="translate(130, 210)">
      <rect width="140" height="40" fill="url(#posEncodingGrad)" stroke="#4A90E2" stroke-width="1.5" rx="4"/>
      <text x="70" y="25" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Positional Encoding</text>
    </g>

    <path d="M 200 255 L 200 280" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 4 Transformer Encoder Blocks -->
    <g transform="translate(30, 290)">
      <rect width="340" height="340" fill="#F0F4F8" stroke="#A5C8E1" stroke-width="2" rx="8"/>
      <text x="170" y="-10" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">4 × Transformer Encoder Blocks</text>
      
      <!-- Detailed Block -->
      <g transform="translate(15, 15)">
        <rect width="310" height="310" fill="#FFFFFF" stroke="#A5C8E1" stroke-dasharray="4,4"/>
        
        <!-- Layer Norm 1 -->
        <rect x="55" y="15" width="200" height="25" fill="#F2F2F2" stroke="#999" rx="3"/>
        <text x="155" y="32" font-family="Arial" font-size="11" text-anchor="middle">Layer Norm</text>

        <!-- MHSA -->
        <g transform="translate(55, 55)">
          <rect width="200" height="90" fill="#A5C8E1" fill-opacity="0.3" stroke="#4A90E2" stroke-width="1.5"/>
          <text x="100" y="22" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Multi-Head Self-Attention</text>
          
          <!-- QKV Matrices -->
          <g transform="translate(20, 35)">
            <rect width="35" height="35" fill="#4A90E2" fill-opacity="0.2" stroke="#4A90E2"/><text x="17.5" y="22" font-family="Arial" font-size="10" text-anchor="middle">Q</text>
            <rect x="62.5" y="0" width="35" height="35" fill="#4A90E2" fill-opacity="0.2" stroke="#4A90E2"/><text x="80" y="22" font-family="Arial" font-size="10" text-anchor="middle">K</text>
            <rect x="125" y="0" width="35" height="35" fill="#4A90E2" fill-opacity="0.2" stroke="#4A90E2"/><text x="142.5" y="22" font-family="Arial" font-size="10" text-anchor="middle">V</text>
          </g>
        </g>

        <!-- Residual Connection 1 -->
        <path d="M 30 10 L 30 160 L 140 160" fill="none" stroke="#FF8C00" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#residualArrow)"/>
        <text x="40" y="150" font-family="Arial" font-size="10" fill="#FF8C00">Residual</text>
        <circle cx="155" cy="160" r="10" fill="#FFF" stroke="#333"/>
        <text x="155" y="164" font-family="Arial" font-size="14" text-anchor="middle">+</text>

        <!-- Layer Norm 2 -->
        <rect x="55" y="185" width="200" height="25" fill="#F2F2F2" stroke="#999" rx="3"/>
        <text x="155" y="202" font-family="Arial" font-size="11" text-anchor="middle">Layer Norm</text>

        <!-- MLP -->
        <rect x="55" y="225" width="200" height="45" fill="#E8EEF3" stroke="#4A90E2" stroke-width="1.5" rx="4"/>
        <text x="155" y="253" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">MLP (Feed-Forward)</text>

        <!-- Residual Connection 2 -->
        <path d="M 280 170 L 280 285 L 170 285" fill="none" stroke="#FF8C00" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#residualArrow)"/>
        <circle cx="155" cy="285" r="10" fill="#FFF" stroke="#333"/>
        <text x="155" y="289" font-family="Arial" font-size="14" text-anchor="middle">+</text>
      </g>
      <text x="350" y="170" font-family="Arial" font-size="11" fill="#666">14×14×768</text>
    </g>

    <path d="M 200 635 L 200 660" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- MLP Head -->
    <g transform="translate(120, 670)">
      <rect width="160" height="50" fill="#E8EEF3" stroke="#4A90E2" stroke-width="1.5" rx="4"/>
      <text x="80" y="32" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">MLP Classification Head</text>
    </g>

    <path d="M 200 725 L 200 745" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Output Probabilities -->
    <g transform="translate(150, 755)">
      <rect width="100" height="40" fill="#FF8C00" fill-opacity="0.1" stroke="#FF8C00" stroke-width="2"/>
      <text x="50" y="25" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Probabilities</text>
    </g>
  </g>
</svg>
