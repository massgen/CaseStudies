<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional Academic Color Palette -->
  <!-- Muted Blues: #4A90E2, #A5C8E1, #E8EEF3 -->
  <!-- Grays: #333333, #666666, #999999, #D1D1D1, #F0F0F0 -->
  <!-- Accent: #F5A623 (Orange/Highlight) -->

  <defs>
    <!-- Background Grid -->
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>

    <!-- CNN Filter Pattern: 3x3 grid with active weights -->
    <pattern id="filterPattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#E8EEF3" stroke="#4A90E2" stroke-width="0.5"/>
      <rect width="3" height="3" fill="#4A90E2" fill-opacity="0.6"/>
      <rect x="6" y="6" width="3" height="3" fill="#4A90E2" fill-opacity="0.6"/>
    </pattern>

    <!-- Positional Encoding Pattern -->
    <pattern id="posPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#E8EEF3"/>
      <path d="M 0 10 Q 5 0 10 10 T 20 10" stroke="#F5A623" stroke-width="1" fill="none" opacity="0.4"/>
    </pattern>

    <!-- Arrows -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333" />
    </marker>
    <marker id="accentArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F5A623" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrid)" />

  <!-- Main Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#333" text-anchor="middle">CNN vs. Transformer Architecture Comparison</text>

  <!-- Headers -->
  <text x="300" y="80" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A90E2" text-anchor="middle">Convolutional Neural Network</text>
  <text x="900" y="80" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A90E2" text-anchor="middle">Vision Transformer (ViT)</text>

  <!-- PIPELINE ALIGNMENT GUIDES (Hidden in final, but used for design) -->
  <!-- Input Stage: y=100 -->
  <!-- Embedding Stage: y=230 -->
  <!-- Core Stage: y=320-650 -->
  <!-- Head Stage: y=680 -->
  <!-- Output Stage: y=750 -->

  <!-- LEFT: CNN PIPELINE -->
  <g transform="translate(100, 100)">
    <!-- Input Image -->
    <rect x="140" y="0" width="120" height="120" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
    <image x="145" y="5" width="110" height="110" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMTAiIGhlaWdodD0iMTEwIj48cmVjdCB3aWR0aD0iMTEwIiBoZWlnaHQ9IjExMCIgZmlsbD0iI0E1QzhFMSIvPjxjaXJjbGUgY3g9IjU1IiBjeT0iNTUiIHI9IjM1IiBmaWxsPSIjNEE5MEUyIi8+PC9zdmc+" />
    <text x="200" y="135" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Input Image</text>
    <text x="200" y="150" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">224×224×3</text>

    <!-- Arrow to Conv -->
    <line x1="200" y1="160" x2="200" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Conv Layers -->
    <g transform="translate(110, 200)">
      <rect width="180" height="90" fill="#E8EEF3" stroke="#4A90E2" stroke-width="1.5" rx="5"/>
      <!-- Filter Pattern visualization -->
      <rect x="20" y="15" width="40" height="40" fill="url(#filterPattern)" stroke="#4A90E2"/>
      <rect x="70" y="15" width="40" height="40" fill="url(#filterPattern)" stroke="#4A90E2"/>
      <rect x="120" y="15" width="40" height="40" fill="url(#filterPattern)" stroke="#4A90E2"/>
      <text x="90" y="70" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Convolutional Layers</text>
      <text x="90" y="82" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">112×112×64</text>
    </g>

    <!-- Arrow to Pooling -->
    <line x1="200" y1="290" x2="200" y2="310" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Pooling Layers (Core Processing area) -->
    <g transform="translate(130, 320)">
      <rect width="140" height="60" fill="#D1D1D1" stroke="#999" rx="5"/>
      <text x="70" y="30" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Max Pooling</text>
      <text x="70" y="45" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">56×56×64</text>
      <text x="70" y="55" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">(Downsampling)</text>
    </g>

    <text x="200" y="410" font-family="Arial" font-size="20" fill="#999" text-anchor="middle">...</text>

    <!-- Additional Conv/Pool blocks -->
    <rect x="120" y="430" width="160" height="40" fill="#E8EEF3" stroke="#4A90E2" stroke-dasharray="4,2"/>
    <text x="200" y="455" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Deep Features</text>
    <text x="200" y="485" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">7×7×512</text>

    <!-- Fully Connected -->
    <g transform="translate(120, 500)">
      <rect width="160" height="130" fill="#F9F9F9" stroke="#333" stroke-width="1.5" rx="5"/>
      <g stroke="#D1D1D1" stroke-width="0.5">
        <line x1="20" y1="20" x2="140" y2="20"/><line x1="20" y1="20" x2="140" y2="40"/><line x1="20" y1="20" x2="140" y2="60"/><line x1="20" y1="20" x2="140" y2="80"/>
        <line x1="20" y1="40" x2="140" y2="20"/><line x1="20" y1="40" x2="140" y2="40"/><line x1="20" y1="40" x2="140" y2="60"/><line x1="20" y1="40" x2="140" y2="80"/>
        <line x1="20" y1="60" x2="140" y2="20"/><line x1="20" y1="60" x2="140" y2="40"/><line x1="20" y1="60" x2="140" y2="60"/><line x1="20" y1="60" x2="140" y2="80"/>
      </g>
      <text x="80" y="105" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Fully Connected</text>
      <text x="80" y="120" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">1×1×1024</text>
    </g>

    <!-- Head Alignment -->
    <line x1="200" y1="630" x2="200" y2="680" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Output Probabilities -->
    <g transform="translate(150, 680)">
      <rect width="100" height="60" fill="#F5A623" fill-opacity="0.1" stroke="#F5A623" stroke-width="2"/>
      <text x="50" y="30" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Softmax</text>
      <rect x="15" y="40" width="70" height="10" fill="#F5A623" opacity="0.3"/>
      <text x="50" y="52" font-family="Arial" font-size="10" text-anchor="middle">Probabilities</text>
    </g>
  </g>

  <!-- RIGHT: TRANSFORMER PIPELINE -->
  <g transform="translate(700, 100)">
    <!-- Input Image with Grid -->
    <rect x="140" y="0" width="120" height="120" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
    <image x="145" y="5" width="110" height="110" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMTAiIGhlaWdodD0iMTEwIj48cmVjdCB3aWR0aD0iMTEwIiBoZWlnaHQ9IjExMCIgZmlsbD0iI0E1QzhFMSIvPjxjaXJjbGUgY3g9IjU1IiBjeT0iNTUiIHI9IjM1IiBmaWxsPSIjNEE5MEUyIi8+PC9zdmc+" />
    <!-- Patch Grid -->
    <g stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.8">
      <line x1="170" y1="0" x2="170" y2="120"/><line x1="200" y1="0" x2="200" y2="120"/><line x1="230" y1="0" x2="230" y2="120"/>
      <line x1="140" y1="30" x2="260" y2="30"/><line x1="140" y1="60" x2="260" y2="60"/><line x1="140" y1="90" x2="260" y2="90"/>
    </g>
    <text x="200" y="135" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Patch Embedding</text>
    <text x="200" y="150" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">14×14×768</text>

    <!-- Arrow to Pos Encoding -->
    <line x1="200" y1="160" x2="200" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Positional Encoding -->
    <g transform="translate(130, 200)">
      <rect width="140" height="40" fill="url(#posPattern)" stroke="#F5A623" stroke-width="1.5" rx="5"/>
      <text x="70" y="25" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Positional Encoding</text>
    </g>

    <!-- Arrow to Transformer blocks -->
    <line x1="200" y1="240" x2="200" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- 4 Transformer Blocks container -->
    <g transform="translate(40, 270)">
      <rect width="320" height="380" fill="#F0F4F8" stroke="#A5C8E1" stroke-width="2" rx="8"/>
      <text x="160" y="-10" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">4 × Transformer Encoder Blocks</text>
      
      <!-- One Expanded Block Detail -->
      <g transform="translate(15, 15)">
        <rect width="290" height="350" fill="#FFFFFF" stroke="#A5C8E1" stroke-dasharray="4,4"/>
        
        <!-- Block Stages -->
        <!-- Layer Norm 1 -->
        <rect x="60" y="10" width="170" height="25" fill="#F2F2F2" stroke="#999" rx="4"/>
        <text x="145" y="27" font-family="Arial" font-size="11" text-anchor="middle">Layer Norm</text>

        <!-- Multi-Head Self-Attention -->
        <g transform="translate(50, 50)">
          <rect width="190" height="100" fill="#E8EEF3" stroke="#4A90E2" stroke-width="1.5" rx="4"/>
          <text x="95" y="20" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Multi-Head Self-Attention</text>
          
          <!-- Q, K, V Visualization -->
          <g transform="translate(15, 35)">
            <rect width="40" height="40" fill="#A5C8E1" stroke="#4A90E2"/><text x="20" y="25" font-family="Arial" font-size="12" text-anchor="middle">Q</text>
            <rect x="60" y="0" width="40" height="40" fill="#A5C8E1" stroke="#4A90E2"/><text x="80" y="25" font-family="Arial" font-size="12" text-anchor="middle">K</text>
            <rect x="120" y="0" width="40" height="40" fill="#A5C8E1" stroke="#4A90E2"/><text x="140" y="25" font-family="Arial" font-size="12" text-anchor="middle">V</text>
          </g>
        </g>

        <!-- Residual Connection 1 (Bypass) -->
        <path d="M 30 15 L 30 170 L 130 170" fill="none" stroke="#F5A623" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#accentArrow)"/>
        <circle cx="145" cy="170" r="12" fill="#FFFFFF" stroke="#333"/>
        <text x="145" y="175" font-family="Arial" font-size="18" text-anchor="middle">+</text>

        <!-- Layer Norm 2 -->
        <rect x="60" y="200" width="170" height="25" fill="#F2F2F2" stroke="#999" rx="4"/>
        <text x="145" y="217" font-family="Arial" font-size="11" text-anchor="middle">Layer Norm</text>

        <!-- MLP (Feed Forward) -->
        <rect x="50" y="240" width="190" height="50" fill="#E8EEF3" stroke="#4A90E2" stroke-width="1.5" rx="4"/>
        <text x="145" y="270" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">FFN (MLP)</text>

        <!-- Residual Connection 2 (Bypass) -->
        <path d="M 260 180 L 260 310 L 160 310" fill="none" stroke="#F5A623" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#accentArrow)"/>
        <circle cx="145" cy="310" r="12" fill="#FFFFFF" stroke="#333"/>
        <text x="145" y="315" font-family="Arial" font-size="18" text-anchor="middle">+</text>
      </g>
    </g>

    <!-- Classifier Head -->
    <g transform="translate(110, 680)">
      <rect width="180" height="50" fill="#E8EEF3" stroke="#4A90E2" stroke-width="1.5" rx="5"/>
      <text x="90" y="30" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">MLP Classification Head</text>
    </g>

    <!-- Arrow to Output -->
    <line x1="200" y1="730" x2="200" y2="750" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Output -->
    <g transform="translate(150, 750)">
      <rect width="100" height="40" fill="#F5A623" fill-opacity="0.1" stroke="#F5A623" stroke-width="2"/>
      <text x="50" y="25" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Probabilities</text>
    </g>
  </g>
</svg>
