<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional Academic Color Palette -->
  <defs>
    <!-- Background Grid -->
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>

    <!-- CNN Filter Pattern: 3x3 grid -->
    <pattern id="filterPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="11" height="11" fill="#E8EEF3" stroke="#4A90E2" stroke-width="0.5"/>
      <rect x="1" y="1" width="3" height="3" fill="#4A90E2" fill-opacity="0.7"/>
      <rect x="5" y="5" width="3" height="3" fill="#4A90E2" fill-opacity="0.7"/>
      <rect x="9" y="9" width="3" height="3" fill="#4A90E2" fill-opacity="0.7"/>
    </pattern>

    <!-- Positional Encoding Pattern: Sinusoidal waves -->
    <pattern id="posPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#E8EEF3"/>
      <path d="M 0 10 Q 10 0 20 10 T 40 10" stroke="#F5A623" stroke-width="1.5" fill="none" opacity="0.5"/>
      <path d="M 0 30 Q 10 20 20 30 T 40 30" stroke="#4A90E2" stroke-width="1.5" fill="none" opacity="0.3"/>
    </pattern>

    <!-- Arrows -->
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333333" />
    </marker>
    <marker id="bypassArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F5A623" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrid)" />

  <!-- Title -->
  <text x="600" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="bold" fill="#333" text-anchor="middle">CNN vs. Transformer: Image Processing Architectures</text>

  <!-- Headers -->
  <text x="300" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#4A90E2" text-anchor="middle">Convolutional Neural Network (CNN)</text>
  <text x="900" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#4A90E2" text-anchor="middle">Vision Transformer (ViT)</text>

  <!-- LEFT: CNN PIPELINE -->
  <g transform="translate(50, 80)">
    <!-- Stage 1: Input -->
    <g transform="translate(200, 0)">
      <rect x="-50" y="0" width="100" height="100" fill="#FFF" stroke="#333" stroke-width="1.5"/>
      <rect x="-45" y="5" width="90" height="90" fill="#A5C8E1" opacity="0.5"/>
      <circle cx="0" cy="50" r="30" fill="#4A90E2" opacity="0.8"/>
      <text x="0" y="115" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Input Image</text>
      <text x="0" y="130" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">224×224×3</text>
    </g>
    <line x1="200" y1="140" x2="200" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Stage 2: Convolutional Layers -->
    <g transform="translate(110, 180)">
      <rect width="180" height="80" fill="#E8EEF3" stroke="#4A90E2" stroke-width="2" rx="5"/>
      <!-- Filters -->
      <rect x="20" y="15" width="30" height="30" fill="url(#filterPattern)" stroke="#4A90E2" stroke-width="0.5"/>
      <rect x="75" y="15" width="30" height="30" fill="url(#filterPattern)" stroke="#4A90E2" stroke-width="0.5"/>
      <rect x="130" y="15" width="30" height="30" fill="url(#filterPattern)" stroke="#4A90E2" stroke-width="0.5"/>
      <text x="90" y="60" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Convolutional Layers</text>
      <text x="90" y="72" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">112×112×64</text>
    </g>
    <line x1="200" y1="260" x2="200" y2="290" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Stage 3: Core (Pooling & Deep Conv) -->
    <g transform="translate(100, 300)">
      <!-- Pooling -->
      <rect x="25" y="0" width="150" height="50" fill="#F0F0F0" stroke="#999" rx="5"/>
      <text x="100" y="25" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Pooling (Downsampling)</text>
      <text x="100" y="40" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">56×56×64</text>
      
      <!-- Bridge -->
      <line x1="100" y1="50" x2="100" y2="80" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
      
      <!-- Deep Layers -->
      <rect x="10" y="80" width="180" height="150" fill="#E8EEF3" stroke="#4A90E2" stroke-width="1.5" rx="5" stroke-dasharray="4,2"/>
      <text x="100" y="155" font-family="Arial" font-size="13" fill="#666" font-style="italic" text-anchor="middle">Iterative Conv &amp; Pool</text>
      <text x="100" y="210" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">7×7×512</text>
    </g>
    <line x1="200" y1="530" x2="200" y2="560" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Stage 4: Fully Connected -->
    <g transform="translate(110, 650)">
      <rect width="180" height="50" fill="#F9F9F9" stroke="#333" stroke-width="1.5" rx="5"/>
      <circle cx="30" cy="15" r="3" fill="#4A90E2"/><circle cx="30" cy="25" r="3" fill="#4A90E2"/><circle cx="30" cy="35" r="3" fill="#4A90E2"/>
      <circle cx="150" cy="15" r="3" fill="#F5A623"/><circle cx="150" cy="25" r="3" fill="#F5A623"/><circle cx="150" cy="35" r="3" fill="#F5A623"/>
      <line x1="33" y1="15" x2="147" y2="15" stroke="#DDD"/><line x1="33" y1="15" x2="147" y2="25" stroke="#DDD"/><line x1="33" y1="15" x2="147" y2="35" stroke="#DDD"/>
      <line x1="33" y1="35" x2="147" y2="15" stroke="#DDD"/><line x1="33" y1="35" x2="147" y2="25" stroke="#DDD"/><line x1="33" y1="35" x2="147" y2="35" stroke="#DDD"/>
      <text x="90" y="45" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Fully Connected Layers</text>
    </g>
    <line x1="200" y1="700" x2="200" y2="730" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Stage 5: Output -->
    <g transform="translate(140, 730)">
      <rect width="120" height="40" fill="#F5A623" fill-opacity="0.1" stroke="#F5A623" stroke-width="2" rx="3"/>
      <text x="60" y="25" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Probabilities</text>
    </g>
  </g>

  <!-- RIGHT: TRANSFORMER PIPELINE -->
  <g transform="translate(650, 80)">
    <!-- Stage 1: Input -->
    <g transform="translate(250, 0)">
      <rect x="-50" y="0" width="100" height="100" fill="#FFF" stroke="#333" stroke-width="1.5"/>
      <rect x="-45" y="5" width="90" height="90" fill="#A5C8E1" opacity="0.5"/>
      <circle cx="0" cy="50" r="30" fill="#4A90E2" opacity="0.8"/>
      <!-- Grid overlay -->
      <g stroke="#FFF" stroke-width="0.5" stroke-opacity="0.8">
        <line x1="-25" y1="0" x2="-25" y2="100"/><line x1="0" y1="0" x2="0" y2="100"/><line x1="25" y1="0" x2="25" y2="100"/>
        <line x1="-50" y1="25" x2="50" y2="25"/><line x1="-50" y1="50" x2="50" y2="50"/><line x1="-50" y1="75" x2="50" y2="75"/>
      </g>
      <text x="0" y="115" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Patch Embedding</text>
      <text x="0" y="130" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">14×14×768</text>
    </g>
    <line x1="250" y1="140" x2="250" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Stage 2: Positional Encoding -->
    <g transform="translate(160, 180)">
      <rect width="180" height="40" fill="url(#posPattern)" stroke="#F5A623" stroke-width="1.5" rx="5"/>
      <text x="90" y="25" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Positional Encoding</text>
    </g>
    <line x1="250" y1="220" x2="250" y2="290" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Stage 3: Transformer Block -->
    <g transform="translate(60, 300)">
      <rect width="380" height="330" fill="#F0F4F8" stroke="#A5C8E1" stroke-width="2" rx="8"/>
      <text x="190" y="-10" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4× Transformer Encoder Block</text>
      
      <!-- Expanded Block Content -->
      <g transform="translate(20, 20)">
        <rect width="340" height="290" fill="#FFF" stroke="#A5C8E1" stroke-dasharray="4,4" rx="4"/>
        
        <!-- Layer Norm 1 -->
        <rect x="85" y="10" width="170" height="25" fill="#F2F2F2" stroke="#999" rx="4"/>
        <text x="170" y="27" font-family="Arial" font-size="11" text-anchor="middle">Layer Norm</text>

        <!-- MHSA -->
        <g transform="translate(60, 50)">
          <rect width="220" height="80" fill="#E8EEF3" stroke="#4A90E2" stroke-width="1.5" rx="4"/>
          <text x="110" y="20" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Multi-Head Self-Attention</text>
          <!-- QKV -->
          <g transform="translate(20, 35)">
            <rect width="40" height="30" fill="#A5C8E1" stroke="#4A90E2"/><text x="20" y="20" font-family="Arial" font-size="11" text-anchor="middle">Q</text>
            <rect x="70" y="0" width="40" height="30" fill="#A5C8E1" stroke="#4A90E2"/><text x="90" y="20" font-family="Arial" font-size="11" text-anchor="middle">K</text>
            <rect x="140" y="0" width="40" height="30" fill="#A5C8E1" stroke="#4A90E2"/><text x="160" y="20" font-family="Arial" font-size="11" text-anchor="middle">V</text>
          </g>
        </g>

        <!-- Residual 1 -->
        <path d="M 40 10 L 40 155 L 155 155" fill="none" stroke="#F5A623" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#bypassArrow)"/>
        <circle cx="170" cy="155" r="12" fill="#FFF" stroke="#333"/>
        <text x="170" y="161" font-family="Arial" font-size="18" text-anchor="middle">+</text>

        <!-- Layer Norm 2 -->
        <rect x="85" y="180" width="170" height="25" fill="#F2F2F2" stroke="#999" rx="4"/>
        <text x="170" y="197" font-family="Arial" font-size="11" text-anchor="middle">Layer Norm</text>

        <!-- FFN -->
        <rect x="60" y="220" width="220" height="40" fill="#E8EEF3" stroke="#4A90E2" stroke-width="1.5" rx="4"/>
        <text x="170" y="245" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Feed-Forward Network (MLP)</text>

        <!-- Residual 2 -->
        <path d="M 310 165 L 310 280 L 185 280" fill="none" stroke="#F5A623" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#bypassArrow)"/>
        <circle cx="170" cy="280" r="12" fill="#FFF" stroke="#333"/>
        <text x="170" y="286" font-family="Arial" font-size="18" text-anchor="middle">+</text>
      </g>
    </g>
    <line x1="250" y1="630" x2="250" y2="650" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Stage 4: MLP Head -->
    <g transform="translate(160, 650)">
      <rect width="180" height="50" fill="#E8EEF3" stroke="#4A90E2" stroke-width="1.5" rx="5"/>
      <text x="90" y="30" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">MLP Classification Head</text>
    </g>
    <line x1="250" y1="700" x2="250" y2="730" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Stage 5: Output -->
    <g transform="translate(190, 730)">
      <rect width="120" height="40" fill="#F5A623" fill-opacity="0.1" stroke="#F5A623" stroke-width="2" rx="3"/>
      <text x="60" y="25" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Probabilities</text>
    </g>
  </g>

  <!-- Alignment Guides (Annotations) -->
  <g font-family="Arial" font-size="10" fill="#AAA" text-anchor="middle">
    <text x="600" y="140">IMAGE INPUT</text>
    <text x="600" y="260">EMBEDDING / CONV</text>
    <text x="600" y="530">PROCESSING BLOCKS</text>
    <text x="600" y="680">CLASSIFICATION HEAD</text>
    <text x="600" y="770">OUTPUT</text>
  </g>
</svg>
