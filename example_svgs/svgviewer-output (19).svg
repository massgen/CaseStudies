<svg width="1400" height="800" viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#grid)"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    </pattern>

    <!-- Clipping -->
    <clipPath id="clipSum">
      <rect x="0" y="-250" width="420" height="500" />
    </clipPath>
    <clipPath id="clipComp">
      <rect x="0" y="-100" width="300" height="200" />
    </clipPath>

    <!-- Harmonic Styles -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700family=JetBrains+Monodisplay=swap');
      
      text { font-family: 'Inter', sans-serif; fill: #1e293b; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .title { font-size: 32px; font-weight: 700; fill: #0f172a; }
      .formula { font-family: "Times New Roman", serif; font-style: italic; font-size: 24px; fill: #475569; }
      .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; fill: #64748b; }
      .axis { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .label { font-size: 10px; fill: #94a3b8; font-weight: 600; }
      
      .h1 { stroke: #ef4444; } .h1-f { fill: #ef4444; }
      .h2 { stroke: #f97316; } .h2-f { fill: #f97316; }
      .h3 { stroke: #eab308; } .h3-f { fill: #eab308; }
      .h4 { stroke: #22c55e; } .h4-f { fill: #22c55e; }
      .h5 { stroke: #06b6d4; } .h5-f { fill: #06b6d4; }
      .h6 { stroke: #6366f1; } .h6-f { fill: #6366f1; }
      .h7 { stroke: #d946ef; } .h7-f { fill: #d946ef; }
      
      /* Animation: Continuous Flow */
      @keyframes flow {
        from { transform: translateX(0); }
        to { transform: translateX(-300px); }
      }
      .flow-wave { animation: flow 4s linear infinite; }
      
      /* Phase Indicators */
      @keyframes rot1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes rot2 { from { transform: rotate(0deg); } to { transform: rotate(720deg); } }
      @keyframes rot3 { from { transform: rotate(0deg); } to { transform: rotate(1080deg); } }
      @keyframes rot4 { from { transform: rotate(0deg); } to { transform: rotate(1440deg); } }
      @keyframes rot5 { from { transform: rotate(0deg); } to { transform: rotate(1800deg); } }
      @keyframes rot6 { from { transform: rotate(0deg); } to { transform: rotate(2160deg); } }
      @keyframes rot7 { from { transform: rotate(0deg); } to { transform: rotate(2520deg); } }
      
      .rot-h1 { animation: rot1 4s linear infinite; }
      .rot-h2 { animation: rot2 4s linear infinite; }
      .rot-h3 { animation: rot3 4s linear infinite; }
      .rot-h4 { animation: rot4 4s linear infinite; }
      .rot-h5 { animation: rot5 4s linear infinite; }
      .rot-h6 { animation: rot6 4s linear infinite; }
      .rot-h7 { animation: rot7 4s linear infinite; }

      @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.5; } }
      .conn { stroke: #cbd5e1; stroke-dasharray: 4,4; animation: pulse 2s ease-in-out infinite; }
      
      .complex-line { stroke: #2563eb; stroke-width: 5; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" fill="url(#gridMajor)" />

  <!-- Title & Formula -->
  <g transform="translate(700, 60)">
    <text text-anchor="middle" class="title">Fourier Series Decomposition Dashboard</text>
    <text y="40" text-anchor="middle" class="formula">f(t) = a₀/2 + ∑ [aₙ cos(nωt) + bₙ sin(nωt)]</text>
  </g>

  <!-- COLUMN 1: COMPLEX WAVEFORM (Left) -->
  <g transform="translate(60, 420)">
    <rect x="-10" y="-260" width="440" height="520" rx="12" fill="white" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="2" />
    <text x="210" y="-230" text-anchor="middle" class="section-title">Composite Signal (Sum of Harmonics)</text>
    
    <!-- Axes -->
    <g class="axis">
      <path d="M 0,-210 V 210" />
      <path d="M 0,0 H 420" />
      <!-- Ticks -->
      <path d="M 150,-5 V 5 M 300,-5 V 5" />
    </g>
    <text x="150" y="20" class="label" text-anchor="middle">T</text>
    <text x="300" y="20" class="label" text-anchor="middle">2T</text>
    <text x="-15" y="-200" class="label" text-anchor="end">Magnitude</text>

    <g clip-path="url(#clipSum)">
      <g class="flow-wave">
        <!-- Sum of 7 Harmonics path (3 periods) -->
        <path class="complex-line" d="M 0.0,-56.3 L 15.0,-18.2 L 30.0,34.1 L 45.0,85.6 L 60.0,113.4 L 75.0,107.2 L 90.0,75.1 L 105.0,37.2 L 120.0,6.5 L 135.0,-15.4 L 150.0,-35.1 L 165.0,-64.3 L 180.0,-108.2 L 195.0,-152.1 L 210.0,-173.4 L 225.0,-158.2 L 240.0,-115.4 L 255.0,-68.3 L 270.0,-42.1 L 285.0,-48.6 L 300.0,-56.3 L 315.0,-18.2 L 330.0,34.1 L 345.0,85.6 L 360.0,113.4 L 375.0,107.2 L 390.0,75.1 L 405.0,37.2 L 420.0,6.5 L 435.0,-15.4 L 450.0,-35.1 L 465.0,-64.3 L 480.0,-108.2 L 495.0,-152.1 L 510.0,-173.4 L 525.0,-158.2 L 540.0,-115.4 L 555.0,-68.3 L 570.0,-42.1 L 585.0,-48.6 L 600.0,-56.3 L 615.0,-18.2 L 630.0,34.1 L 645.0,85.6 L 660.0,113.4 L 675.0,107.2 L 690.0,75.1 L 705.0,37.2 L 720.0,6.5 L 735.0,-15.4 L 750.0,-35.1 L 765.0,-64.3 L 780.0,-108.2 L 795.0,-152.1 L 810.0,-173.4 L 825.0,-158.2 L 840.0,-115.4 L 855.0,-68.3 L 870.0,-42.1 L 885.0,-48.6 L 900.0,-56.3" />
      </g>
    </g>
    
    <!-- Annotations -->
    <g font-size="10" font-weight="700" fill="#475569">
      <text x="210" y="-195" text-anchor="middle">SHARP PEAK</text>
      <circle cx="210" cy="-173" r="6" fill="none" stroke="#ef4444" stroke-width="2" />
      <text x="65" y="145" text-anchor="middle">FLAT REGION</text>
      <path d="M 50,113 L 80,113" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3,3" />
    </g>
  </g>

  <!-- COLUMN 2: DECOMPOSITION (Middle) -->
  <g transform="translate(580, 110)">
    <text x="150" y="10" text-anchor="middle" class="section-title">Harmonic Components</text>
    
    <!-- Harmonic 1: f -->
    <g transform="translate(0, 70)">
      <line x2="300" class="axis" opacity="0.3" />
      <text x="-15" y="4" text-anchor="end" class="mono">f: A=1.00 φ=0°</text>
      <g clip-path="url(#clipComp)"><g class="flow-wave">
        <path d="M 0.0,0.0 L 30.0,58.8 L 60.0,95.1 L 90.0,95.1 L 120.0,58.8 L 150.0,-0.0 L 180.0,-58.8 L 210.0,-95.1 L 240.0,-95.1 L 270.0,-58.8 L 300.0,0.0 L 330.0,58.8 L 360.0,95.1 L 390.0,95.1 L 420.0,58.8 L 450.0,-0.0 L 480.0,-58.8 L 510.0,-95.1 L 540.0,-95.1 L 570.0,-58.8 L 600.0,0.0 L 630.0,58.8 L 660.0,95.1 L 690.0,95.1 L 720.0,58.8 L 750.0,-0.0 L 780.0,-58.8 L 810.0,-95.1 L 840.0,-95.1 L 870.0,-58.8 L 900.0,0.0" fill="none" class="h1" stroke-width="2.5" transform="scale(1, 0.4)"/>
      </g></g>
      <line x1="0" y1="0" x2="-100" y2="240" class="conn" />
    </g>

    <!-- Harmonic 2: 2f -->
    <g transform="translate(0, 150)">
      <line x2="300" class="axis" opacity="0.3" />
      <text x="-15" y="4" text-anchor="end" class="mono">2f: A=0.50 φ=45°</text>
      <g clip-path="url(#clipComp)"><g class="flow-wave">
        <path d="M 0.0,35.4 L 30.0,35.4 L 60.0,-35.4 L 90.0,-35.4 L 120.0,35.4 L 150.0,35.4 L 180.0,-35.4 L 210.0,-35.4 L 240.0,35.4 L 270.0,35.4 L 300.0,35.4 L 330.0,35.4 L 360.0,-35.4 L 390.0,-35.4 L 420.0,35.4 L 450.0,35.4 L 480.0,-35.4 L 510.0,-35.4 L 540.0,35.4 L 570.0,35.4 L 600.0,35.4 L 630.0,35.4 L 660.0,-35.4 L 690.0,-35.4 L 720.0,35.4 L 750.0,35.4 L 780.0,-35.4 L 810.0,-35.4 L 840.0,35.4 L 870.0,35.4 L 900.0,35.4" fill="none" class="h2" stroke-width="2.2" transform="scale(1, 0.6)"/>
      </g></g>
      <line x1="0" y1="0" x2="-100" y2="160" class="conn" />
    </g>

    <!-- Harmonic 3: 3f -->
    <g transform="translate(0, 230)">
      <line x2="300" class="axis" opacity="0.3" />
      <text x="-15" y="4" text-anchor="end" class="mono">3f: A=0.80 φ=90°</text>
      <g clip-path="url(#clipComp)"><g class="flow-wave">
        <path d="M 0.0,-80.0 L 30.0,76.1 L 60.0,-12.3 L 90.0,-64.7 L 120.0,80.0 L 150.0,-24.7 L 180.0,-52.1 L 210.0,79.0 L 240.0,-36.5 L 270.0,-39.3 L 300.0,-80.0 L 330.0,76.1 L 360.0,-12.3 L 390.0,-64.7 L 420.0,80.0 L 450.0,-24.7 L 480.0,-52.1 L 510.0,79.0 L 540.0,-36.5 L 570.0,-39.3 L 600.0,-80.0 L 630.0,76.1 L 660.0,-12.3 L 690.0,-64.7 L 720.0,80.0 L 750.0,-24.7 L 780.0,-52.1 L 810.0,79.0 L 840.0,-36.5 L 870.0,-39.3 L 900.0,-80.0" fill="none" class="h3" stroke-width="2" transform="scale(1, 0.5)"/>
      </g></g>
      <line x1="0" y1="0" x2="-100" y2="80" class="conn" />
    </g>

    <!-- Harmonic 4: 4f -->
    <g transform="translate(0, 310)">
      <line x2="300" class="axis" opacity="0.3" />
      <text x="-15" y="4" text-anchor="end" class="mono">4f: A=0.30 φ=180°</text>
      <g clip-path="url(#clipComp)"><g class="flow-wave">
        <path d="M 0.0,0.0 L 15.0,-28.5 L 30.0,0.0 L 45.0,28.5 L 60.0,0.0 L 75.0,-28.5 L 90.0,0.0 L 105.0,28.5 L 120.0,0.0 L 135.0,-28.5 L 150.0,0.0 L 165.0,28.5 L 180.0,0.0 L 195.0,-28.5 L 210.0,0.0 L 225.0,28.5 L 240.0,0.0 L 255.0,-28.5 L 270.0,0.0 L 285.0,28.5 L 300.0,0.0 L 315.0,-28.5 L 330.0,0.0 L 345.0,28.5 L 360.0,0.0 L 375.0,-28.5 L 390.0,0.0 L 405.0,28.5 L 420.0,0.0 L 435.0,-28.5 L 450.0,0.0 L 465.0,28.5 L 480.0,0.0 L 495.0,-28.5 L 510.0,0.0 L 525.0,28.5 L 540.0,0.0 L 555.0,-28.5 L 570.0,0.0 L 585.0,28.5 L 600.0,0.0 L 615.0,-28.5 L 630.0,0.0 L 645.0,28.5 L 660.0,0.0 L 675.0,-28.5 L 690.0,0.0 L 705.0,28.5 L 720.0,0.0 L 735.0,-28.5 L 750.0,0.0 L 765.0,28.5 L 780.0,0.0 L 795.0,-28.5 L 810.0,0.0 L 825.0,28.5 L 840.0,0.0 L 855.0,-28.5 L 870.0,0.0 L 885.0,28.5 L 900.0,0.0" fill="none" class="h4" stroke-width="1.8" transform="scale(1, 0.8)"/>
      </g></g>
      <line x1="0" y1="0" x2="-100" y2="0" class="conn" />
    </g>

    <!-- Harmonic 5: 5f -->
    <g transform="translate(0, 390)">
      <line x2="300" class="axis" opacity="0.3" />
      <text x="-15" y="4" text-anchor="end" class="mono">5f: A=0.60 φ=270°</text>
      <g clip-path="url(#clipComp)"><g class="flow-wave">
        <path d="M 0.0,60.0 L 15.0,-57.1 L 30.0,48.5 L 60.0,-48.5 L 75.0,57.1 L 90.0,-60.0 L 105.0,57.1 L 120.0,-48.5 L 150.0,48.5 L 165.0,-57.1 L 180.0,60.0 L 195.0,-57.1 L 210.0,48.5 L 240.0,-48.5 L 255.0,57.1 L 270.0,-60.0 L 285.0,57.1 L 300.0,60.0 L 315.0,-57.1 L 330.0,48.5 L 360.0,-48.5 L 375.0,57.1 L 390.0,-60.0 L 405.0,57.1 L 420.0,-48.5 L 450.0,48.5 L 465.0,-57.1 L 480.0,60.0 L 495.0,-57.1 L 510.0,48.5 L 540.0,-48.5 L 555.0,57.1 L 570.0,-60.0 L 585.0,57.1 L 600.0,60.0 L 615.0,-57.1 L 630.0,48.5 L 660.0,-48.5 L 675.0,57.1 L 690.0,-60.0 L 705.0,57.1 L 720.0,-48.5 L 750.0,48.5 L 765.0,-57.1 L 780.0,60.0 L 795.0,-57.1 L 810.0,48.5 L 840.0,-48.5 L 855.0,57.1 L 870.0,-60.0 L 885.0,57.1 L 900.0,60.0" fill="none" class="h5" stroke-width="1.5" transform="scale(1, 0.6)"/>
      </g></g>
      <line x1="0" y1="0" x2="-100" y2="-80" class="conn" />
    </g>

    <!-- Harmonic 6: 6f -->
    <g transform="translate(0, 470)">
      <line x2="300" class="axis" opacity="0.3" />
      <text x="-15" y="4" text-anchor="end" class="mono">6f: A=0.25 φ=0°</text>
      <g clip-path="url(#clipComp)"><g class="flow-wave">
        <path d="M 0.0,0.0 L 8.3,-23.7 L 16.6,-14.7 L 25.0,14.7 L 33.3,23.7 L 41.6,0.0 L 50.0,0.0 L 58.3,-23.7 L 66.6,-14.7 L 75.0,14.7 L 83.3,23.7 L 91.6,0.0 L 100.0,0.0 L 108.3,-23.7 L 116.6,-14.7 L 125.0,14.7 L 133.3,23.7 L 141.6,0.0 L 150.0,0.0 L 158.3,-23.7 L 166.6,-14.7 L 175.0,14.7 L 183.3,23.7 L 191.6,0.0 L 200.0,0.0 L 208.3,-23.7 L 216.6,-14.7 L 225.0,14.7 L 233.3,23.7 L 241.6,0.0 L 250.0,0.0 L 258.3,-23.7 L 266.6,-14.7 L 275.0,14.7 L 283.3,23.7 L 291.6,0.0 L 300.0,0.0 L 308.3,-23.7 L 316.6,-14.7 L 325.0,14.7 L 333.3,23.7 L 341.6,0.0 L 350.0,0.0 L 358.3,-23.7 L 366.6,-14.7 L 375.0,14.7 L 383.3,23.7 L 391.6,0.0 L 400.0,0.0 L 408.3,-23.7 L 416.6,-14.7 L 425.0,14.7 L 433.3,23.7 L 441.6,0.0 L 450.0,0.0 L 458.3,-23.7 L 466.6,-14.7 L 475.0,14.7 L 483.3,23.7 L 491.6,0.0 L 500.0,0.0 L 508.3,-23.7 L 516.6,-14.7 L 525.0,14.7 L 533.3,23.7 L 541.6,0.0 L 550.0,0.0 L 558.3,-23.7 L 566.6,-14.7 L 575.0,14.7 L 583.3,23.7 L 591.6,0.0 L 600.0,0.0 L 608.3,-23.7 L 616.6,-14.7 L 625.0,14.7 L 633.3,23.7 L 641.6,0.0 L 650.0,0.0 L 658.3,-23.7 L 666.6,-14.7 L 675.0,14.7 L 683.3,23.7 L 691.6,0.0 L 700.0,0.0 L 708.3,-23.7 L 716.6,-14.7 L 725.0,14.7 L 733.3,23.7 L 741.6,0.0 L 750.0,0.0 L 758.3,-23.7 L 766.6,-14.7 L 775.0,14.7 L 783.3,23.7 L 791.6,0.0 L 800.0,0.0 L 808.3,-23.7 L 816.6,-14.7 L 825.0,14.7 L 833.3,23.7 L 841.6,0.0 L 850.0,0.0 L 858.3,-23.7 L 866.6,-14.7 L 875.0,14.7 L 883.3,23.7 L 891.6,0.0 L 900.0,0.0" fill="none" class="h6" stroke-width="1.5" transform="scale(1, 0.7)"/>
      </g></g>
      <line x1="0" y1="0" x2="-100" y2="-160" class="conn" />
    </g>

    <!-- Harmonic 7: 7f -->
    <g transform="translate(0, 550)">
      <line x2="300" class="axis" opacity="0.3" />
      <text x="-15" y="4" text-anchor="end" class="mono">7f: A=0.35 φ=135°</text>
      <g clip-path="url(#clipComp)"><g class="flow-wave">
        <path d="M 0.0,24.7 L 15.0,33.3 L 30.0,-33.3 L 45.0,-24.7 L 60.0,24.7 L 75.0,33.3 L 90.0,-33.3 L 105.0,-24.7 L 120.0,24.7 L 135.0,33.3 L 150.0,-33.3 L 165.0,-24.7 L 180.0,24.7 L 195.0,33.3 L 210.0,-33.3 L 225.0,-24.7 L 240.0,24.7 L 255.0,33.3 L 270.0,-33.3 L 285.0,-24.7 L 300.0,24.7 L 315.0,33.3 L 330.0,-33.3 L 345.0,-24.7 L 360.0,24.7 L 375.0,33.3 L 390.0,-33.3 L 405.0,-24.7 L 420.0,24.7 L 435.0,33.3 L 450.0,-33.3 L 465.0,-24.7 L 480.0,24.7 L 495.0,33.3 L 510.0,-33.3 L 525.0,-24.7 L 540.0,24.7 L 555.0,33.3 L 570.0,-33.3 L 585.0,-24.7 L 600.0,24.7 L 615.0,33.3 L 630.0,-33.3 L 645.0,-24.7 L 660.0,24.7 L 675.0,33.3 L 690.0,-33.3 L 705.0,-24.7 L 720.0,24.7 L 735.0,33.3 L 750.0,-33.3 L 765.0,-24.7 L 780.0,24.7 L 795.0,33.3 L 810.0,-33.3 L 825.0,-24.7 L 840.0,24.7 L 855.0,33.3 L 870.0,-33.3 L 885.0,-24.7 L 900.0,24.7" fill="none" class="h7" stroke-width="1.2" transform="scale(1, 0.8)"/>
      </g></g>
      <line x1="0" y1="0" x2="-100" y2="-240" class="conn" />
    </g>
  </g>

  <!-- COLUMN 3: ANALYSIS (Right) -->
  <g transform="translate(1050, 110)">
    <!-- Phase Spectrum -->
    <text x="160" y="10" text-anchor="middle" class="section-title">Phase Spectrum</text>
    <g transform="translate(0, 40)">
      <!-- Phase Circles -->
      <g transform="translate(50, 50)">
        <circle r="40" fill="white" stroke="#e2e8f0" stroke-width="2" />
        <g class="rot-h1"><line x1="0" y1="0" x2="40" y2="0" class="h1" stroke-width="4" stroke-linecap="round" /></g>
        <text y="60" text-anchor="middle" class="label">f</text>
      </g>
      <g transform="translate(160, 50)">
        <circle r="40" fill="white" stroke="#e2e8f0" stroke-width="2" />
        <g class="rot-h2" transform="rotate(45)"><line x1="0" y1="0" x2="40" y2="0" class="h2" stroke-width="4" stroke-linecap="round" /></g>
        <text y="60" text-anchor="middle" class="label">2f</text>
      </g>
      <g transform="translate(270, 50)">
        <circle r="40" fill="white" stroke="#e2e8f0" stroke-width="2" />
        <g class="rot-h3" transform="rotate(90)"><line x1="0" y1="0" x2="40" y2="0" class="h3" stroke-width="4" stroke-linecap="round" /></g>
        <text y="60" text-anchor="middle" class="label">3f</text>
      </g>
      <g transform="translate(50, 160)">
        <circle r="40" fill="white" stroke="#e2e8f0" stroke-width="2" />
        <g class="rot-h4" transform="rotate(180)"><line x1="0" y1="0" x2="40" y2="0" class="h4" stroke-width="4" stroke-linecap="round" /></g>
        <text y="60" text-anchor="middle" class="label">4f</text>
      </g>
      <g transform="translate(160, 160)">
        <circle r="40" fill="white" stroke="#e2e8f0" stroke-width="2" />
        <g class="rot-h5" transform="rotate(270)"><line x1="0" y1="0" x2="40" y2="0" class="h5" stroke-width="4" stroke-linecap="round" /></g>
        <text y="60" text-anchor="middle" class="label">5f</text>
      </g>
      <g transform="translate(270, 160)">
        <circle r="40" fill="white" stroke="#e2e8f0" stroke-width="2" />
        <g class="rot-h6"><line x1="0" y1="0" x2="40" y2="0" class="h6" stroke-width="4" stroke-linecap="round" /></g>
        <text y="60" text-anchor="middle" class="label">6f</text>
      </g>
      <g transform="translate(160, 270)">
        <circle r="40" fill="white" stroke="#e2e8f0" stroke-width="2" />
        <g class="rot-h7" transform="rotate(135)"><line x1="0" y1="0" x2="40" y2="0" class="h7" stroke-width="4" stroke-linecap="round" /></g>
        <text y="60" text-anchor="middle" class="label">7f</text>
      </g>
    </g>

    <!-- Magnitude Spectrum -->
    <g transform="translate(0, 420)">
      <text x="160" y="0" text-anchor="middle" class="section-title">Magnitude Spectrum</text>
      <g class="axis">
        <path d="M 30,30 V 210 H 310" />
      </g>
      <rect x="50" y="30" width="25" height="180" class="h1-f" rx="3" />
      <rect x="85" y="120" width="25" height="90" class="h2-f" rx="3" />
      <rect x="120" y="66" width="25" height="144" class="h3-f" rx="3" />
