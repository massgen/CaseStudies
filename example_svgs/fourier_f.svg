<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" style="background-color: #f8f9fa; font-family: sans-serif; font-size: 14px;" onload="init()">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#e0e0e0" stroke-width="1"/>
    </pattern>
    <clipPath id="clip-zone"><rect x="0" y="0" width="400" height="800"/></clipPath>
    <style>
      .axis { stroke: #333; stroke-width: 1; }
      .grid { fill: url(#grid); }
      .label { fill: #555; }
      .title { font-size: 18px; font-weight: bold; fill: #333; text-anchor: middle; }
      .wave { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }
      .wave-sum { stroke: #222; stroke-width: 3; }
      
      @keyframes flow {
        from { transform: translateX(0px); }
        to { transform: translateX(-200px); }
      }
      .flowing {
        animation: flow 4s linear infinite;
      }
      
      .bar { opacity: 0.8; transition: opacity 0.2s; }
      .bar:hover { opacity: 1.0; }
      
      .connection-line { fill: none; stroke-width: 1; opacity: 0.3; }
    </style>
    <script type="text/javascript">
      // <![CDATA[
      function init() {
        const harmonics = [
          {f: 1, a: 1.0, p: 0.0},
          {f: 2, a: 0.6, p: Math.PI / 3},
          {f: 3, a: 0.4, p: -Math.PI / 4},
          {f: 4, a: 0.3, p: Math.PI / 2},
          {f: 5, a: 0.2, p: 0.0},
          {f: 6, a: 0.15, p: Math.PI},
          {f: 7, a: 0.1, p: Math.PI / 6}
        ];
        
        const periodPx = 200;
        const totalPoints = 300;
        const widthPx = periodPx * 3;
        
        // Generate Sum Path
        let dSum = "M ";
        for (let i = 0; i <= totalPoints; i++) {
          let x = i * widthPx / totalPoints;
          let y = 0;
          harmonics.forEach(h => {
             let angle = (x / periodPx) * 2 * Math.PI * h.f + h.p;
             y += h.a * Math.sin(angle);
          });
          // Scale: Max sum approx 2.5. Scale 60.
          dSum += `${x.toFixed(1)},${(-y * 60).toFixed(1)} `;
          if (i < totalPoints) dSum += "L ";
        }
        document.getElementById('path-sum').setAttribute('d', dSum);
        
        // Generate Component Paths
        harmonics.forEach((h, index) => {
           let d = "M ";
           for (let i = 0; i <= totalPoints; i++) {
             let x = i * widthPx / totalPoints;
             let angle = (x / periodPx) * 2 * Math.PI * h.f + h.p;
             let y = h.a * Math.sin(angle);
             // Scale for mini plots. Scale 30.
             d += `${x.toFixed(1)},${(-y * 30).toFixed(1)} `;
             if (i < totalPoints) d += "L ";
           }
           let el = document.getElementById(`path-comp-${index}`);
           if(el) el.setAttribute('d', d);
        });
      }
      // ]]>
    </script>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" class="grid" />

  <!-- CONNECTIONS (Drawn first to be behind) -->
  <g id="connections">
     <!-- Connecting right edge of Sum (450, 400) to left edge of Components (500, y) -->
     <!-- 1: Red -->
     <path d="M 500 100 C 480 100, 470 400, 450 400" class="connection-line" stroke="#FF3B30" />
     <!-- 2: Orange -->
     <path d="M 500 200 C 480 200, 470 400, 450 400" class="connection-line" stroke="#FF9500" />
     <!-- 3: Yellow -->
     <path d="M 500 300 C 480 300, 470 400, 450 400" class="connection-line" stroke="#FFCC00" />
     <!-- 4: Green -->
     <path d="M 500 400 C 480 400, 470 400, 450 400" class="connection-line" stroke="#4CD964" />
     <!-- 5: Cyan -->
     <path d="M 500 500 C 480 500, 470 400, 450 400" class="connection-line" stroke="#5AC8FA" />
     <!-- 6: Blue -->
     <path d="M 500 600 C 480 600, 470 400, 450 400" class="connection-line" stroke="#007AFF" />
     <!-- 7: Purple -->
     <path d="M 500 700 C 480 700, 470 400, 450 400" class="connection-line" stroke="#5856D6" />
  </g>

  <!-- LEFT: SUM -->
  <g transform="translate(50, 0)">
    <text x="200" y="30" class="title">Composite Waveform</text>
    <line x1="0" y1="400" x2="400" y2="400" class="axis" stroke-dasharray="4,4"/>
    <line x1="0" y1="50" x2="0" y2="750" class="axis"/>
    
    <g clip-path="url(#clip-zone)">
      <g class="flowing" transform="translate(0, 400)">
        <path id="path-sum" class="wave wave-sum" />
      </g>
    </g>
    
    <text x="200" y="750" text-anchor="middle" font-style="italic" font-size="16">f(t) = Σ A_n sin(nωt + φ_n)</text>
  </g>

  <!-- MIDDLE: COMPONENTS -->
  <g transform="translate(500, 0)">
    <text x="200" y="30" class="title">Decomposition</text>
    
    <!-- Component 1 -->
    <g transform="translate(0, 100)">
       <line x1="40" y1="0" x2="400" y2="0" stroke="#ddd"/>
       <text x="0" y="5" font-size="12" font-weight="bold">f₀</text>
       <text x="20" y="5" font-size="10" fill="#777">A=1.0</text>
       <g clip-path="url(#clip-zone)">
         <g class="flowing" transform="translate(40, 0)">
           <path id="path-comp-0" class="wave" stroke="#FF3B30" />
         </g>
       </g>
    </g>
    
    <!-- Component 2 -->
    <g transform="translate(0, 200)">
       <line x1="40" y1="0" x2="400" y2="0" stroke="#ddd"/>
       <text x="0" y="5" font-size="12" font-weight="bold">2f₀</text>
       <text x="25" y="5" font-size="10" fill="#777">A=0.6</text>
       <g clip-path="url(#clip-zone)">
         <g class="flowing" transform="translate(40, 0)">
           <path id="path-comp-1" class="wave" stroke="#FF9500" />
         </g>
       </g>
    </g>

    <!-- Component 3 -->
    <g transform="translate(0, 300)">
       <line x1="40" y1="0" x2="400" y2="0" stroke="#ddd"/>
       <text x="0" y="5" font-size="12" font-weight="bold">3f₀</text>
       <text x="25" y="5" font-size="10" fill="#777">A=0.4</text>
       <g clip-path="url(#clip-zone)">
         <g class="flowing" transform="translate(40, 0)">
           <path id="path-comp-2" class="wave" stroke="#FFCC00" />
         </g>
       </g>
    </g>

    <!-- Component 4 -->
    <g transform="translate(0, 400)">
       <line x1="40" y1="0" x2="400" y2="0" stroke="#ddd"/>
       <text x="0" y="5" font-size="12" font-weight="bold">4f₀</text>
       <text x="25" y="5" font-size="10" fill="#777">A=0.3</text>
       <g clip-path="url(#clip-zone)">
         <g class="flowing" transform="translate(40, 0)">
           <path id="path-comp-3" class="wave" stroke="#4CD964" />
         </g>
       </g>
    </g>
    
    <!-- Component 5 -->
    <g transform="translate(0, 500)">
       <line x1="40" y1="0" x2="400" y2="0" stroke="#ddd"/>
       <text x="0" y="5" font-size="12" font-weight="bold">5f₀</text>
       <text x="25" y="5" font-size="10" fill="#777">A=0.2</text>
       <g clip-path="url(#clip-zone)">
         <g class="flowing" transform="translate(40, 0)">
           <path id="path-comp-4" class="wave" stroke="#5AC8FA" />
         </g>
       </g>
    </g>

    <!-- Component 6 -->
    <g transform="translate(0, 600)">
       <line x1="40" y1="0" x2="400" y2="0" stroke="#ddd"/>
       <text x="0" y="5" font-size="12" font-weight="bold">6f₀</text>
       <text x="25" y="5" font-size="10" fill="#777">A=0.15</text>
       <g clip-path="url(#clip-zone)">
         <g class="flowing" transform="translate(40, 0)">
           <path id="path-comp-5" class="wave" stroke="#007AFF" />\n         </g>
       </g>
    </g>

    <!-- Component 7 -->
    <g transform="translate(0, 700)">
       <line x1="40" y1="0" x2="400" y2="0" stroke="#ddd"/>
       <text x="0" y="5" font-size="12" font-weight="bold">7f₀</text>
       <text x="25" y="5" font-size="10" fill="#777">A=0.1</text>
       <g clip-path="url(#clip-zone)">
         <g class="flowing" transform="translate(40, 0)">
           <path id="path-comp-6" class="wave" stroke="#5856D6" />
         </g>
       </g>
    </g>
  </g>

  <!-- RIGHT: SPECTRUM -->
  <g transform="translate(950, 0)">
    <text x="200" y="30" class="title">Frequency Spectrum</text>
    
    <!-- Phase -->
    <text x="200" y="60" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Phase Spectrum</text>
    <g transform="translate(0, 100)">
       <!-- 7 Circles -->
       <!-- 1: Red -->
       <g transform="translate(50, 40)">
         <circle r="20" fill="white" stroke="#ccc"/>
         <line x1="0" y1="0" x2="20" y2="0" stroke="#FF3B30" stroke-width="2" transform="rotate(0)"/>
         <text y="35" text-anchor="middle" font-size="10">f₀</text>
       </g>
       <!-- 2: Orange (PI/3 = 60deg) -->
       <g transform="translate(100, 40)">
         <circle r="20" fill="white" stroke="#ccc"/>
         <line x1="0" y1="0" x2="20" y2="0" stroke="#FF9500" stroke-width="2" transform="rotate(-60)"/>
         <text y="35" text-anchor="middle" font-size="10">2f₀</text>
       </g>
       <!-- 3: Yellow (-PI/4 = -45deg) -->
       <g transform="translate(150, 40)">
         <circle r="20" fill="white" stroke="#ccc"/>
         <line x1="0" y1="0" x2="20" y2="0" stroke="#FFCC00" stroke-width="2" transform="rotate(45)"/>
         <text y="35" text-anchor="middle" font-size="10">3f₀</text>
       </g>
       <!-- 4: Green (PI/2 = 90deg) -->
       <g transform="translate(200, 40)">
         <circle r="20" fill="white" stroke="#ccc"/>
         <line x1="0" y1="0" x2="20" y2="0" stroke="#4CD964" stroke-width="2" transform="rotate(-90)"/>
         <text y="35" text-anchor="middle" font-size="10">4f₀</text>
       </g>
       <!-- 5: Cyan (0) -->
       <g transform="translate(250, 40)">
         <circle r="20" fill="white" stroke="#ccc"/>
         <line x1="0" y1="0" x2="20" y2="0" stroke="#5AC8FA" stroke-width="2" transform="rotate(0)"/>
         <text y="35" text-anchor="middle" font-size="10">5f₀</text>
       </g>
       <!-- 6: Blue (PI = 180) -->\n       <g transform="translate(300, 40)">
         <circle r="20" fill="white" stroke="#ccc"/>
         <line x1="0" y1="0" x2="20" y2="0" stroke="#007AFF" stroke-width="2" transform="rotate(-180)"/>
         <text y="35" text-anchor="middle" font-size="10">6f₀</text>
       </g>
       <!-- 7: Purple (PI/6 = 30) -->
       <g transform="translate(350, 40)">
         <circle r="20" fill="white" stroke="#ccc"/>
         <line x1="0" y1="0" x2="20" y2="0" stroke="#5856D6" stroke-width="2" transform="rotate(-30)"/>
         <text y="35" text-anchor="middle" font-size="10">7f₀</text>
       </g>
    </g>

    <!-- Magnitude -->
    <text x="200" y="420" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Magnitude Spectrum</text>
    <g transform="translate(0, 450)">
       <line x1="20" y1="250" x2="380" y2="250" class="axis"/>
       <line x1="20" y1="250" x2="20" y2="0" class="axis"/>
       
       <!-- Scale: Height 250px. Max Amp 1.0 -> 230px -->
       <!-- 1 -->
       <rect x="50" y="20" width="30" height="230" fill="#FF3B30" class="bar"/>
       <text x="65" y="265" text-anchor="middle" font-size="10">f₀</text>
       
       <!-- 2 -->
       <rect x="100" y="112" width="30" height="138" fill="#FF9500" class="bar"/>
       <text x="115" y="265" text-anchor="middle" font-size="10">2f₀</text>
       
       <!-- 3 -->
       <rect x="150" y="158" width="30" height="92" fill="#FFCC00" class="bar"/>
       <text x="165" y="265" text-anchor="middle" font-size="10">3f₀</text>
       
       <!-- 4 -->
       <rect x="200" y="181" width="30" height="69" fill="#4CD964" class="bar"/>
       <text x="215" y="265" text-anchor="middle" font-size="10">4f₀</text>
       
       <!-- 5 -->
       <rect x="250" y="204" width="30" height="46" fill="#5AC8FA" class="bar"/>
       <text x="265" y="265" text-anchor="middle" font-size="10">5f₀</text>
       
       <!-- 6 -->
       <rect x="300" y="215.5" width="30" height="34.5" fill="#007AFF" class="bar"/>
       <text x="315" y="265" text-anchor="middle" font-size="10">6f₀</text>
       
       <!-- 7 -->
       <rect x="350" y="227" width="30" height="23" fill="#5856D6" class="bar"/>
       <text x="365" y="265" text-anchor="middle" font-size="10">7f₀</text>
    </g>
  </g>
</svg>